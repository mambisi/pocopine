name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Toolchain channel + components + targets are pinned in
# `rust-toolchain.toml` at the repo root. dtolnay/rust-toolchain@master
# reads that file when no channel is specified, so all three jobs
# share one source of truth.

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-wasm:
    name: clippy (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-wasm
      # Most workspace crates target wasm32; pocopine-cli is host-only so it
      # gets its own clippy run below.
      - run: cargo clippy --workspace --exclude pocopine-cli --target wasm32-unknown-unknown --all-targets -- -D warnings

  clippy-host:
    name: clippy (host — pocopine-cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-host
      - run: cargo clippy -p pocopine-cli --all-targets -- -D warnings
