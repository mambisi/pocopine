name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read
  packages: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Toolchain channel + components + targets are pinned in
# `rust-toolchain.toml` at the repo root. The CI jobs install the
# same nightly explicitly so dtolnay/rust-toolchain@master doesn't
# need to read the toml file (its support for that is partial).
#
# Cost strategy:
#   - `changes` job fans out per-area outputs so docs-only or
#     scoped changes don't trigger the full pipeline.
#   - macOS / Windows builds run only on tags (`v*`) and manual
#     dispatch — they're 10×/2× linux billing and the wasm32
#     target is platform-independent, so PRs and main pushes
#     stay linux-only.
#   - Examples + jsbench builds collapsed into one runner that
#     loops, so toolchain + wasm-pack install costs are paid once
#     instead of 11 times.

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      wasm: ${{ steps.filter.outputs.wasm }}
      cli: ${{ steps.filter.outputs.cli }}
      examples: ${{ steps.filter.outputs.examples }}
      observability: ${{ steps.filter.outputs.observability }}
      redis: ${{ steps.filter.outputs.redis }}
      browser: ${{ steps.filter.outputs.browser }}
      richtext_perf: ${{ steps.filter.outputs.richtext_perf }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Filters are evaluated against the PR diff (pull_request
          # event) or the push diff (push event). Tag pushes and
          # workflow_dispatch don't have a diff base — paths-filter
          # treats those as "all filters true", so manual / release
          # runs always exercise the full matrix.
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            wasm:
              - 'crates/**'
              - '!crates/pocopine-cli/**'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            cli:
              - 'crates/pocopine-cli/**'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            examples:
              - 'examples/**'
              - 'jsbench/**'
              - 'crates/**'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            observability:
              - 'crates/pocopine-observe/**'
              - 'crates/pocopine-logging/**'
              - 'crates/pocopine-analytics/**'
              - 'examples/observability-smoke/**'
              - 'scripts/ci/otlp_smoke.sh'
              - '.github/workflows/ci.yml'
            redis:
              - 'crates/pocopine-events/**'
              - 'crates/pocopine-live/**'
              - 'crates/pocopine-jobs/**'
              - '.github/workflows/ci.yml'
            browser:
              - 'crates/pine/**'
              - 'crates/pine-charts/**'
              - 'crates/pine-motion/**'
              - 'crates/pocopine/**'
              - 'crates/pocopine-core/**'
              - 'crates/pocopine-macros/**'
              - '.github/workflows/ci.yml'
            richtext_perf:
              - 'crates/pine-richtext/**'
              - 'examples/richtext/**'
              - 'tests/playwright/**'
              - 'playwright.config.mjs'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            ci:
              - '.github/workflows/**'
              - 'scripts/ci/**'

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-wasm:
    name: clippy (wasm32)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-wasm
      # Most workspace crates target wasm32. Host-only crates and examples pull
      # in provider SDKs, axum, sqlx, redis, or tokio[net], which intentionally
      # do not compile for wasm32 and are covered by host checks.
      - run: >
          cargo clippy --workspace
          --exclude pocopine-cli
          --exclude pocopine-auth-credentials
          --exclude pocopine-auth-jwt
          --exclude pocopine-deploy
          --exclude pocopine-deploy-fly
          --exclude pocopine-deploy-railway
          --exclude pocopine-deploy-render
          --exclude pocopine-jobs
          --exclude pocopine-launcher
          --exclude pocopine-server
          --exclude pocopine-storage-gcs
          --exclude pocopine-storage-s3
          --exclude pocopine-sync
          --exclude pocopine-sync-crud
          --exclude pocopine-sync-sqlx
          --exclude pocopine-sync-sqlite
          --exclude blog
          --exclude file-browser-example
          --exclude hn
          --exclude keep-example
          --exclude live-example
          --exclude observability-smoke
          --exclude site
          --exclude sync-example
          --exclude website
          --target wasm32-unknown-unknown
          --all-targets
          -- -D warnings

  clippy-host:
    name: clippy (host — pocopine-cli)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-host
      - run: cargo clippy -p pocopine-cli --all-targets -- -D warnings

  build-host:
    name: build (host — pocopine-cli)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
      - uses: Swatinem/rust-cache@v2
        with:
          # Share cache with clippy-host — same crate, same target,
          # same profile, so debug artifacts overlap.
          key: clippy-host
      # The wasm32 workspace build that used to live here was
      # redundant with `clippy-wasm` (clippy already type-checks
      # the full crate graph). Cross-OS coverage moved to the
      # `cross-platform-build` job below, which only runs on
      # tags / manual dispatch.
      - run: cargo build -p pocopine-cli

  cross-platform-build:
    name: cross-platform build (${{ matrix.os }})
    # Run only on release tags or manual dispatch. macOS billing is
    # 10× linux, Windows is 2×; per-PR cross-OS runs were the
    # largest single line item on the bill. The wasm32 target is
    # platform-independent (covered by clippy-wasm on linux) so
    # only the host CLI binary needs cross-OS validation, and that
    # only matters at release time.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.os }}
      - name: build (host — pocopine-cli)
        run: cargo build -p pocopine-cli --release

  test-host:
    name: cargo test (host)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-host
          # Host workspace tests compile multiple cdylib/rlib crates and
          # examples with colliding output names. Reusing target artifacts
          # from a broad restore key can leave Cargo pointing at stale local
          # crate metadata, so this job only caches registry/git deps.
          cache-targets: false
      # `pine-icons` ships fs-based manifest tests; `pocopine-cli`
      # is host-only; `observability-smoke` owns a local OTLP
      # collector and has a dedicated job below. Other crates' #[test]s
      # either have no host-runnable shape (gated on wasm32) or live in
      # `src/` and run cleanly on host.
      #
      # The sync CRUD macro crate is the exception: its trybuild suite
      # spawns nested cargo builds and dev-depends on `pocopine-sync-crud`,
      # while `pocopine-sync-crud` normally depends on the macro crate.
      # Keeping those nested builds in an isolated target dir avoids
      # CI-only local crate metadata misses in the broad workspace graph.
      # `--tests` skips doc-tests (a few example snippets reference deps
      # the workspace doesn't carry — they're not the contract here).
      - name: sync CRUD macro host tests
        run: cargo test -p pocopine-sync-crud-macros --tests
        env:
          CARGO_TARGET_DIR: target/sync-crud-macros-host
      - name: SQLx sync helper tests
        run: cargo test -p pocopine-sync-sqlx --features sqlite --tests
      - name: SQLx sync backend feature checks
        run: |
          cargo check -p pocopine-sync-sqlx --features postgres
          cargo check -p pocopine-sync-sqlx --features mysql
      - name: workspace host tests
        run: cargo test --workspace --exclude pine --exclude observability-smoke --exclude pocopine-sync-crud-macros --tests

  observability-otlp:
    name: observability OTLP smoke
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.observability == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
      - uses: Swatinem/rust-cache@v2
        with:
          key: observability-otlp
      # In-process fake OTLP collector. Asserts route correctness,
      # exported span names/attributes, service.name resource metadata,
      # p95 local latency budget, and that raw request payloads are not
      # present in exported telemetry.
      - run: bash scripts/ci/otlp_smoke.sh

  test-live-redis:
    name: live Redis integration
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.redis == 'true'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-live-redis
      - name: events Redis integration tests
        run: cargo test -p pocopine-events --features redis,test-support --tests
      - name: live Redis feature integration tests
        run: cargo test -p pocopine-live --features redis --tests

  test-wasm-node:
    name: wasm-pack test --node (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    # Tests that run under JSDOM/Node — no DOM walker, no real
    # event dispatch. Faster than the browser jobs and catch the
    # bulk of the runtime regressions (reactive core, registry
    # safety, Emit derive, ContextKey).
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pocopine-core
            crate: crates/pocopine-core
            args: ""
          - name: pocopine-emit-derive
            crate: crates/pocopine
            args: --test rfc_056_emit
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
          targets: wasm32-unknown-unknown
      # Install via `taiki-e/install-action` instead of
      # `jetli/wasm-pack-action`. The jetli action shells out to
      # the GitHub Releases CDN, which is intermittently 502'ing
      # ("Unexpected HTTP response: 502" while downloading the
      # `wasm-pack-vX.Y.Z-x86_64-unknown-linux-musl.tar.gz`
      # tarball) and aborts the workflow before any test job
      # runs. taiki-e ships pre-built archives via its own
      # mirror with retry baked in, the same way we install
      # `wasm-bindgen-cli` below — so CI fails on the work, not
      # on a flaky download.
      #
      # Pinned to 0.14.0 to match the version every job
      # downloads (jetli was resolving "latest" each time, which
      # made any future release a quiet regression risk).
      - name: install wasm-pack (pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      # Pin wasm-bindgen-cli to the workspace lockfile version so
      # the test runner's HTTP API matches what `wasm-bindgen-test`
      # in the lockfile expects. The wasm-pack-bundled copy is
      # picked from a build-host heuristic and frequently lags or
      # leads, which surfaces as `http status: 404` against the
      # WebDriver session.
      - name: install wasm-bindgen-cli (locked)
        uses: taiki-e/install-action@v2
        with:
          # Pinned to the workspace lockfile's wasm-bindgen
          # version — the test runner ABI must match exactly or
          # ChromeDriver returns `http status: 404` from the
          # session-init handshake.
          tool: wasm-bindgen-cli@0.2.118
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-node-${{ matrix.name }}
      - run: wasm-pack test --node ${{ matrix.crate }} ${{ matrix.args }}

  test-wasm-browser:
    name: wasm-pack test --firefox (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    # Tests that need a real browser — DOM walker, MutationObserver,
    # focus traps, pp-for keyed reorder, transitions. We use
    # Firefox + geckodriver instead of Chrome + chromedriver because
    # ChromeDriver 148's session-init endpoint is incompatible with
    # `wasm-bindgen-test 0.3.x`'s request shape — the session POST
    # returns `http status: 404` and the test runner aborts before
    # any test code runs. Geckodriver has been the stable path for
    # `wasm-pack test --headless` in CI throughout 2026.
    strategy:
      fail-fast: false
      matrix:
        include:
          # RFC-058 Phase 6.5 — runtime walker is gone; the
          # browser job runs the template-plan suite (compiled
          # mount + lifecycle) and the Pine compound suite.
          - name: pocopine-template-plan
            crate: crates/pocopine
            args: --test template_plan
          - name: pine
            crate: crates/pine
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
          targets: wasm32-unknown-unknown
      - name: install wasm-pack (pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - name: install wasm-bindgen-cli (locked)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.118
      - uses: browser-actions/setup-firefox@v1
        id: setup-firefox
        with:
          firefox-version: latest
      - uses: browser-actions/setup-geckodriver@latest
        id: setup-geckodriver
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-firefox-${{ matrix.name }}
      # The `webdriver.json` in each browser-test crate dir carries
      # `moz:firefoxOptions.args = ["-headless"]`, which Firefox
      # requires for the headless flag (no `--no-sandbox` /
      # `--disable-gpu` analogues needed — Firefox doesn't
      # double-sandbox on the runner and uses its own GPU sandbox
      # gating).
      - name: wasm-pack test --firefox --headless
        env:
          GECKODRIVER: ${{ steps.setup-geckodriver.outputs.geckodriver-path }}
        run: wasm-pack test --firefox --headless ${{ matrix.crate }} ${{ matrix.args }}

  examples:
    name: examples (wasm-pack)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    # Collapsed from an 11-entry matrix to a single runner that
    # loops over the example list. Trade-off: serial builds give
    # up some wall-clock parallelism, but in exchange we pay
    # toolchain + wasm-pack install once instead of 11×, and the
    # rust-cache holds dep artifacts shared across examples
    # (most pull from the workspace crates anyway). Net cost is
    # well under the matrix form even when every example rebuilds.
    #
    # Failure mode: a break in one example aborts the rest of the
    # loop. That's intentional — fix the first failure and rerun.
    # If isolation becomes important, split into 2–3 buckets
    # rather than going back to 11 runners.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
          targets: wasm32-unknown-unknown
      - name: install wasm-pack (pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: examples
          # `workspaces` lists every example dir so each one's
          # `target/` is included in the cache. They share
          # registry/git deps via the global cargo cache.
          workspaces: |
            examples/blog
            examples/counter
            examples/hn
            examples/site
            examples/spa
            examples/tailwind
            examples/todo
            examples/website
            jsbench/pocopine
            jsbench/leptos
            jsbench/yew
      - name: wasm-pack build (all examples)
        run: |
          set -euo pipefail
          for ex in \
            examples/blog \
            examples/counter \
            examples/hn \
            examples/site \
            examples/spa \
            examples/tailwind \
            examples/todo \
            examples/website \
            jsbench/pocopine \
            jsbench/leptos \
            jsbench/yew
          do
            echo "::group::wasm-pack build $ex"
            wasm-pack build --release --target web "$ex"
            echo "::endgroup::"
          done

  richtext-perf:
    name: pine-richtext perf (playwright)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.richtext_perf == 'true'
    # Browser perf bench: builds examples/richtext to wasm, then types
    # / Enter / backspace into a 20–500-paragraph doc and writes one
    # JSON report per scenario under target/perf/. The assertions are
    # generous (per-scenario wall-clock budgets, 30–60 s) so the job
    # fails on catastrophic regressions but rides through normal
    # run-to-run noise. The artifact upload is the primary signal —
    # reviewers compare target/perf/*.json before/after.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
          targets: wasm32-unknown-unknown
      - name: install wasm-pack (pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: richtext-perf
          workspaces: examples/richtext
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Use the playwright-bundled chromium-headless-shell — runs
      # offline and avoids relying on a chrome-stable install on the
      # runner. Matches what `playwright.config.mjs` falls back to
      # when `PLAYWRIGHT_BROWSER_CHANNEL` is unset on CI.
      - name: install playwright chromium
        run: npx playwright install --with-deps chromium
      - name: build richtext wasm
        run: npm run build:richtext
      - name: run perf spec
        run: npx playwright test richtext.perf.spec.mjs --reporter=list
      - name: print perf summaries
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in target/perf/*.json; do
            echo "::group::$f"
            cat "$f"
            echo
            echo "::endgroup::"
          done
      - name: upload perf reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: richtext-perf-reports
          path: target/perf/*.json
          if-no-files-found: warn
          retention-days: 30
