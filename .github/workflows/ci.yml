name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Toolchain channel + components + targets are pinned in
# `rust-toolchain.toml` at the repo root. The CI jobs install the
# same nightly explicitly so dtolnay/rust-toolchain@master doesn't
# need to read the toml file (its support for that is partial).

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-wasm:
    name: clippy (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-wasm
      # Most workspace crates target wasm32; pocopine-cli is host-only so it
      # gets its own clippy run below.
      - run: cargo clippy --workspace --exclude pocopine-cli --target wasm32-unknown-unknown --all-targets -- -D warnings

  clippy-host:
    name: clippy (host — pocopine-cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-host
      - run: cargo clippy -p pocopine-cli --all-targets -- -D warnings

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.os }}
      # Framework + example crates target wasm; build them for the
      # canonical wasm32 target on every OS so platform-specific
      # surprises (path separators, line endings, host toolchain
      # quirks) surface here, not at release time.
      - name: build (wasm32 workspace)
        run: cargo build --workspace --exclude pocopine-cli --target wasm32-unknown-unknown
      # pocopine-cli is the only host-binary crate. Build it for the
      # current OS so each platform's CLI binary is exercised.
      - name: build (host — pocopine-cli)
        run: cargo build -p pocopine-cli

  test-host:
    name: cargo test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-host
      # `pine-icons` ships fs-based manifest tests; `pocopine-cli`
      # is host-only. Other crates' #[test]s either have no
      # host-runnable shape (gated on `cfg(target_arch = "wasm32")`)
      # or live in `src/` and run cleanly on host. `--tests` skips
      # doc-tests (a few example snippets reference deps the
      # workspace doesn't carry — they're not the contract here).
      - run: cargo test --workspace --exclude pine --tests

  test-wasm-node:
    name: wasm-pack test --node (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Tests that run under JSDOM/Node — no DOM walker, no real
    # event dispatch. Faster than the browser jobs and catch the
    # bulk of the runtime regressions (reactive core, registry
    # safety, Emit derive, ContextKey).
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pocopine-core
            crate: crates/pocopine-core
            args: ""
          - name: pocopine-emit-derive
            crate: crates/pocopine
            args: --test rfc_056_emit
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
          targets: wasm32-unknown-unknown
      # Install via `taiki-e/install-action` instead of
      # `jetli/wasm-pack-action`. The jetli action shells out to
      # the GitHub Releases CDN, which is intermittently 502'ing
      # ("Unexpected HTTP response: 502" while downloading the
      # `wasm-pack-vX.Y.Z-x86_64-unknown-linux-musl.tar.gz`
      # tarball) and aborts the workflow before any test job
      # runs. taiki-e ships pre-built archives via its own
      # mirror with retry baked in, the same way we install
      # `wasm-bindgen-cli` below — so CI fails on the work, not
      # on a flaky download.
      #
      # Pinned to 0.14.0 to match the version every job
      # downloads (jetli was resolving "latest" each time, which
      # made any future release a quiet regression risk).
      - name: install wasm-pack (pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      # Pin wasm-bindgen-cli to the workspace lockfile version so
      # the test runner's HTTP API matches what `wasm-bindgen-test`
      # in the lockfile expects. The wasm-pack-bundled copy is
      # picked from a build-host heuristic and frequently lags or
      # leads, which surfaces as `http status: 404` against the
      # WebDriver session.
      - name: install wasm-bindgen-cli (locked)
        uses: taiki-e/install-action@v2
        with:
          # Pinned to the workspace lockfile's wasm-bindgen
          # version — the test runner ABI must match exactly or
          # ChromeDriver returns `http status: 404` from the
          # session-init handshake.
          tool: wasm-bindgen-cli@0.2.118
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-node-${{ matrix.name }}
      - run: wasm-pack test --node ${{ matrix.crate }} ${{ matrix.args }}

  test-wasm-browser:
    name: wasm-pack test --firefox (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Tests that need a real browser — DOM walker, MutationObserver,
    # focus traps, pp-for keyed reorder, transitions. We use
    # Firefox + geckodriver instead of Chrome + chromedriver because
    # ChromeDriver 148's session-init endpoint is incompatible with
    # `wasm-bindgen-test 0.3.x`'s request shape — the session POST
    # returns `http status: 404` and the test runner aborts before
    # any test code runs. Geckodriver has been the stable path for
    # `wasm-pack test --headless` in CI throughout 2026.
    strategy:
      fail-fast: false
      matrix:
        include:
          # RFC-058 Phase 6.5 — runtime walker is gone; the
          # browser job runs the template-plan suite (compiled
          # mount + lifecycle) and the Pine compound suite.
          - name: pocopine-template-plan
            crate: crates/pocopine
            args: --test template_plan
          - name: pine
            crate: crates/pine
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
          targets: wasm32-unknown-unknown
      # Install via `taiki-e/install-action` instead of
      # `jetli/wasm-pack-action`. The jetli action shells out to
      # the GitHub Releases CDN, which is intermittently 502'ing
      # ("Unexpected HTTP response: 502" while downloading the
      # `wasm-pack-vX.Y.Z-x86_64-unknown-linux-musl.tar.gz`
      # tarball) and aborts the workflow before any test job
      # runs. taiki-e ships pre-built archives via its own
      # mirror with retry baked in, the same way we install
      # `wasm-bindgen-cli` below — so CI fails on the work, not
      # on a flaky download.
      #
      # Pinned to 0.14.0 to match the version every job
      # downloads (jetli was resolving "latest" each time, which
      # made any future release a quiet regression risk).
      - name: install wasm-pack (pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      # Pin wasm-bindgen-cli to the workspace lockfile version —
      # see the `test-wasm-node` job for the rationale.
      - name: install wasm-bindgen-cli (locked)
        uses: taiki-e/install-action@v2
        with:
          # Pinned to the workspace lockfile's wasm-bindgen
          # version — the test runner ABI must match exactly or
          # ChromeDriver returns `http status: 404` from the
          # session-init handshake.
          tool: wasm-bindgen-cli@0.2.118
      - uses: browser-actions/setup-firefox@v1
        id: setup-firefox
        with:
          firefox-version: latest
      - uses: browser-actions/setup-geckodriver@latest
        id: setup-geckodriver
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-firefox-${{ matrix.name }}
      # The `webdriver.json` in each browser-test crate dir carries
      # `moz:firefoxOptions.args = ["-headless"]`, which Firefox
      # requires for the headless flag (no `--no-sandbox` /
      # `--disable-gpu` analogues needed — Firefox doesn't
      # double-sandbox on the runner and uses its own GPU sandbox
      # gating).
      - name: wasm-pack test --firefox --headless
        env:
          GECKODRIVER: ${{ steps.setup-geckodriver.outputs.geckodriver-path }}
        run: wasm-pack test --firefox --headless ${{ matrix.crate }} ${{ matrix.args }}

  examples:
    name: examples (wasm-pack)
    runs-on: ubuntu-latest
    # The workspace build above already type-checks each example
    # via plain `cargo build --target wasm32`. This job exercises
    # the full ship pipeline — wasm-bindgen-cli post-processing,
    # JS shim generation, snippet emission — that `cargo build`
    # alone doesn't run. Catches integration regressions
    # (incompatible wasm-bindgen versions, missing target features
    # in `[lib]`, etc.) before they hit anyone deploying.
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/blog
          - examples/counter
          - examples/hn
          - examples/site
          - examples/spa
          - examples/tailwind
          - examples/todo
          - examples/website
          - jsbench/pocopine
          - jsbench/leptos
          - jsbench/yew
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-18
          targets: wasm32-unknown-unknown
      # Install via `taiki-e/install-action` instead of
      # `jetli/wasm-pack-action`. The jetli action shells out to
      # the GitHub Releases CDN, which is intermittently 502'ing
      # ("Unexpected HTTP response: 502" while downloading the
      # `wasm-pack-vX.Y.Z-x86_64-unknown-linux-musl.tar.gz`
      # tarball) and aborts the workflow before any test job
      # runs. taiki-e ships pre-built archives via its own
      # mirror with retry baked in, the same way we install
      # `wasm-bindgen-cli` below — so CI fails on the work, not
      # on a flaky download.
      #
      # Pinned to 0.14.0 to match the version every job
      # downloads (jetli was resolving "latest" each time, which
      # made any future release a quiet regression risk).
      - name: install wasm-pack (pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - uses: Swatinem/rust-cache@v2
        with:
          # Per-example cache so a regression in one doesn't
          # blow away the others' compiled deps.
          key: examples-${{ matrix.example }}
          workspaces: ${{ matrix.example }}
      - name: wasm-pack build (${{ matrix.example }})
        run: wasm-pack build --release --target web ${{ matrix.example }}
