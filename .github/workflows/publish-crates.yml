name: publish-crates

# Publish the workspace crates to crates.io. MANUAL ONLY for now — run it
# (Actions → publish-crates → Run workflow) once the crate names are reserved on
# crates.io and CARGO_REGISTRY_TOKEN is set/rotated. Kept off the version tag so
# the binary release (release.yml) isn't blocked by an unready crates.io publish.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-crates:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain pinned to match rust-toolchain.toml — installed explicitly,
      # same as ci.yml (dtolnay's toml support is partial).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-21
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-publish

      - name: install cargo-workspaces
        run: cargo install cargo-workspaces --locked

      # Publish every publishable workspace crate (examples set `publish = false`
      # and are skipped) in dependency order, at the versions in the tagged
      # commit.
      #   --from-git    publish the current commit as-is (no version bump/commit)
      #   --no-verify   skip cargo's host build-verify — most crates only compile
      #                 for wasm32, so a host verify would fail
      #   --allow-branch '*'  permit the detached HEAD of a tag checkout
      # Already-published versions are skipped, so re-runs are safe.
      #
      # First-release caveats (expect to iterate once):
      #   * crate names must be free or owned on crates.io;
      #   * crates.io rate-limits NEW crate publishes (~1 / 10 min after a small
      #     burst), so a first all-crates release may need a couple of re-runs.
      - name: cargo workspaces publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo workspaces publish \
            --from-git \
            --no-verify \
            --allow-branch '*' \
            --yes
