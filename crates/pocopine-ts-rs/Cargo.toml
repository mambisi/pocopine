[package]
name = "pocopine-ts-rs"
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
description = "Pocopine-owned fork of ts-rs for Rust-to-TypeScript DTO generation."
rust-version = "1.85"

[features]
default = ["serde-compat"]

arrayvec-impl = ["arrayvec"]
bigdecimal-impl = ["bigdecimal"]
bson-uuid-impl = ["bson"]
bytes-impl = ["bytes"]
chrono-impl = ["chrono"]
format = ["dprint-plugin-typescript"]
heapless-impl = ["heapless"]
indexmap-impl = ["indexmap"]
jiff-impl = ["jiff"]
no-serde-warnings = ["pocopine-ts-rs-macros/no-serde-warnings"]
ordered-float-impl = ["ordered-float"]
semver-impl = ["semver"]
serde-compat = ["pocopine-ts-rs-macros/serde-compat"]
serde-json-impl = ["serde_json"]
smol_str-impl = ["smol_str"]
tokio-impl = ["tokio"]
url-impl = ["url"]
uuid-impl = ["uuid"]

[lib]
name = "pocopine_ts_rs"

[dependencies]
pocopine-ts-rs-macros = { path = "../pocopine-ts-rs-macros", version = "0.2.0" }
thiserror = "2"

arrayvec = { version = ">= 0.6, < 0.8", optional = true }
bigdecimal = { version = ">= 0.0.13, < 0.5", features = ["serde"], optional = true }
bson = { version = "2", optional = true }
bytes = { version = "1", optional = true }
chrono = { version = "0.4", optional = true }
dprint-plugin-typescript = { version = "= 0.95", optional = true }
heapless = { version = ">= 0.7, < 0.9", optional = true }
indexmap = { version = "2", optional = true }
jiff = { version = "0.2", optional = true }
ordered-float = { version = ">= 3, < 6", optional = true }
semver = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
smol_str = { version = "0.3", optional = true }
tokio = { version = "1", features = ["sync"], optional = true }
url = { version = "2", optional = true }
uuid = { version = "1", optional = true }

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.40", features = ["sync", "rt"] }
