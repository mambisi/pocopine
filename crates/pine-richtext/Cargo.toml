[package]
name = "pine-richtext"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust-native rich text document model, transforms, editor state, commands, history, and (optional) browser view for Pine."

[lib]
# `cdylib` produces a wasm artifact when the `view` feature is on so apps
# can consume the editor surface directly; `rlib` keeps the crate
# consumable by other Rust libraries (which is also how the model/transform
# tests run today, with no wasm bindings).
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
# By default this crate is target-agnostic: pure model + transform + state
# + commands + history. No DOM, no wasm.
default = []
# Opt-in browser view: pulls in pocopine, wasm-bindgen, and web-sys to
# render an `EditorState` into a contentEditable surface, sync the DOM
# selection back into the model, and dispatch commands on keystrokes.
view = [
    "dep:pocopine",
    "dep:pocopine-core",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "dep:js-sys",
    "dep:serde-wasm-bindgen",
]

[dependencies]
pine-richtext-macros = { workspace = true }
pocopine-crypto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
html5ever = { workspace = true }
# `regex` powers the input-rules typing-time matchers. Default
# features off, `std` + `perf` + `unicode-perl` on. `unicode-perl` is
# the smallest feature that gives us Unicode-aware `\s` / `\d` / `\w`
# (needed for the canonical smart-quote patterns); the full `unicode`
# feature would add ~250 KB of tables this crate doesn't need. The
# `perf` feature keeps the DFA fast path for short matches.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }

# Feature-gated browser-view dependencies.
pocopine = { path = "../pocopine", optional = true }
pocopine-core = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
pulldown-cmark = { version = "0.13.3", default-features = false }
pulldown-cmark-to-cmark = { version = "22.0.0", default-features = false }

[dependencies.web-sys]
version = "0.3"
optional = true
features = [
    "AbstractRange",
    "ClipboardEvent",
    "CharacterData",
    "console",
    "DataTransfer",
    "Document",
    "DocumentFragment",
    "DomRect",
    "DomRectList",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "InputEvent",
    "KeyboardEvent",
    "Node",
    "Performance",
    "Range",
    "Selection",
    "StaticRange",
    "Text",
    "Window",
]

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
trybuild = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-futures = { workspace = true }
wasm-bindgen-test = "0.3"

[[bench]]
name = "transform_hot_paths"
harness = false

[[bench]]
name = "command_hot_paths"
harness = false
