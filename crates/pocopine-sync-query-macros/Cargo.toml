[package]
name = "pocopine-sync-query-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Proc-macros for `pocopine-sync-query` — typed query DSL + predicate evaluator codegen."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { workspace = true, features = ["full", "extra-traits"] }

[dev-dependencies]
pocopine-core = { workspace = true }
pocopine-sync = { workspace = true }
pocopine-sync-query = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt"] }
trybuild = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Required by host-only tests that build a stub `Source` impl —
# `Source::extract_context` takes a `RequestContext` and the macro-
# emitted `tasks::resource(...)` convenience compiles only on host.
pocopine-auth = { workspace = true }
futures = "0.3"
