[package]
name = "locale-typed-api-contract"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
bad-argument = []
missing-key = []
host-key-in-browser = []
catalog-update = []
server-integration = ["dep:pocopine", "dep:pocopine-server", "dep:futures", "dep:tokio"]

[dependencies]
pocopine-locale = { path = "../../.." }

[build-dependencies]
pocopine-locale = { path = "../../.." }
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pocopine = { path = "../../../../pocopine", optional = true }
pocopine-server = { path = "../../../../pocopine-server", features = ["locale"], optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1", features = ["macros", "rt", "time"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
