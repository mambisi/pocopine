[package]
name = "locale-typed-api-contract"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
bad-argument = []
missing-key = []
host-key-in-browser = []
catalog-update = []

[dependencies]
pocopine-locale = { path = "../../.." }

[build-dependencies]
pocopine-locale = { path = "../../.." }
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
