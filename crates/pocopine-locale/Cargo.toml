[package]
name = "pocopine-locale"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Compiled translation catalogs, explicit locales, and shared CLDR message selection for Pocopine."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
icu_decimal = { version = "=2.3.0", default-features = false, features = ["compiled_data", "alloc", "datagen"] }
icu_datetime = { version = "=2.3.0", default-features = false, features = ["compiled_data", "datagen"] }
icu_experimental = { version = "=0.6.0", default-features = false, features = ["compiled_data", "datagen"] }
icu_locale_core = "=2.3.0"
icu_locale = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_provider = { version = "=2.3.0", features = ["sync", "export", "deserialize_json"] }
fixed_decimal = "=0.7.2"
jiff = { version = "=0.2.35", default-features = false, features = ["std", "tzdb-bundle-always"] }
pocopine-crypto = { workspace = true }
pocopine-stylekit = { workspace = true }
pocopine-template-parser = { workspace = true, features = ["inline-scan"] }
pocopine-expr = { workspace = true }
syn = { workspace = true, features = ["visit"] }
proc-macro2 = { workspace = true, features = ["span-locations"] }
toml = "0.8"
quick-xml = "0.38"
roxmltree = "=0.21.1"

icu_provider_blob = { version = "=2.3.0", features = ["export", "alloc"] }
icu_calendar = { version = "=2.3.0", default-features = false, features = ["compiled_data", "datagen"] }
icu_plurals = { version = "=2.3.0", default-features = false, features = ["compiled_data", "datagen"] }
icu_time = { version = "=2.3.0", default-features = false, features = ["compiled_data", "datagen"] }
quote = { workspace = true }
prettyplease = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
icu_plurals = { version = "=2.3.0", default-features = false, features = ["datagen"] }
tempfile = "3"

[features]
default = []
# Explicit size-for-text-parity tradeoff. Plural selection always uses the
# shared generated rules, including when this option is enabled.
strict-parity = ["dep:icu_decimal", "dep:icu_datetime", "dep:icu_experimental", "dep:icu_locale_core", "dep:fixed_decimal", "dep:jiff", "dep:icu_provider", "dep:icu_provider_blob"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
icu_decimal = { version = "=2.3.0", default-features = false, features = ["compiled_data", "alloc", "serde"], optional = true }
icu_datetime = { version = "=2.3.0", default-features = false, features = ["compiled_data", "serde"], optional = true }
icu_experimental = { version = "=0.6.0", default-features = false, features = ["compiled_data", "serde"], optional = true }
icu_locale_core = { version = "=2.3.0", optional = true }
fixed_decimal = { version = "=0.7.2", optional = true }
jiff = { version = "=0.2.35", default-features = false, features = ["std", "tzdb-bundle-always"], optional = true }

icu_provider = { version = "=2.3.0", features = ["sync"], optional = true }
icu_provider_blob = { version = "=2.3.0", features = ["alloc"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
