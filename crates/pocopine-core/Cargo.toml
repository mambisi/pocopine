    "CustomEventInit",
    "Document",
    "DocumentFragment",
    "DomRect",
    "DomRectReadOnly",
    "DomTokenList",
    "DragEvent",
    "Element",
    "ErrorEvent",
    "Event",
    "EventTarget",
    "FocusEvent",
    "HashChangeEvent",
    "Headers",
    "History",
    "HtmlAnchorElement",
    "HtmlCollection",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTemplateElement",
    "HtmlTextAreaElement",
    "InputEvent",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MediaQueryListEvent",
    "MessageEvent",
    "MouseEvent",
    "MutationObserver",
    "MutationObserverInit",
    "MutationRecord",
    "NamedNodeMap",
    "Navigator",
    "Node",
    "NodeList",
    "PageTransitionEvent",
    "Performance",
    "PointerEvent",
    "PopStateEvent",
    "ProgressEvent",
