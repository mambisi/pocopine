[package]
name = "pocopine-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Client-side reactive runtime for pocopine — a Rust/WASM port of Alpine.js."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# RFC-058 Phase 6.5 — pure compiled-views runtime. The runtime
# walker is gone; only the macro-emitted plan applier mounts
# components. Consumers opt into `devtools` for the in-browser
# scope inspector and `mount-profiler` for the per-mount
# instrumentation; both are pure binary-size cost when unused.
default = ["runtime-expr-fallback"]
devtools = []
mount-profiler = []
runtime-expr-fallback = []

[dependencies]
pocopine-expr = { workspace = true }
wasm-bindgen = { workspace = true }
# Hooks `std::panic` so wasm panics surface their message via
# `console.error` instead of the browser-default
# "RuntimeError: unreachable executed" with no message. Installed
# once at `App::run()` so users get the directive `.expect()`
# strings authored throughout the framework without having to
# remember `console_error_panic_hook::set_once()` themselves.
console_error_panic_hook = "0.1"
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
serde_json = "1"
serde-wasm-bindgen = { workspace = true }
once_cell = { workspace = true }
unicode-segmentation = "1"
# RFC 060 Tier 4 — `&'static phf::Map<&'static str,
# &'static ComponentVTable>` populated by the `app!{}` macro
# at expansion time from an explicit `components: [...]` list.
phf = { version = "0.13", features = ["macros"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "AddEventListenerOptions",
    "Animation",
    "AnimationEvent",
