    "Event",
    "EventTarget",
    "FocusEvent",
    "HashChangeEvent",
    "Headers",
    "History",
    "HtmlAnchorElement",
    "HtmlCollection",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTemplateElement",
    "HtmlTextAreaElement",
    "InputEvent",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "KeyboardEvent",
