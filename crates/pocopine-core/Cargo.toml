[package]
name = "pocopine-core"
# 0.2.0 — RFC-095/096: signals-first reactive core. Field signals
# with versioned projections replace the Alpine-era proxy hot path
# (FIELD_CACHE/FRESH_FIELDS deleted, DEPS/REVERSE deleted, magics
# $el/$refs/$dispatch/$id removed, js_bridge is the one explicit
# proxy door). Diverges from the workspace version line.
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Client-side reactive runtime for pocopine — a Rust/WASM port of Alpine.js."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# RFC-058 Phase 6.5 — pure compiled-views runtime. The runtime
# walker is gone; only the macro-emitted plan applier mounts
# components. Consumers opt into `devtools` for the in-browser
# scope inspector and `mount-profiler` for the per-mount
# instrumentation; both are pure binary-size cost when unused.
default = ["runtime-expr-fallback"]
devtools = []
mount-profiler = []
runtime-expr-fallback = []

[dependencies]
pocopine-codec = { workspace = true }
# RFC-095 W2 — Fnv64 backs the per-field dirty-tracking
# fingerprints (`fingerprint` module).
pocopine-crypto = { workspace = true }
pocopine-expr = { workspace = true }
# NOTE: wasm-bindgen's `enable-interning` feature was tried (RFC-095
# W5) and reverted: its per-crossing cache check taxes every DYNAMIC
# string (10k row labels) to speed up a handful of short static
# names — jsbench runLots(10000) regressed +7% with it on, and the
# full geomean was 4% better with it off. Don't re-enable without a
# benchmark showing otherwise.
wasm-bindgen = { workspace = true }
# Hooks `std::panic` so wasm panics surface their message via
# `console.error` instead of the browser-default
# "RuntimeError: unreachable executed" with no message. Installed
# once at `App::run()` so users get the directive `.expect()`
# strings authored throughout the framework without having to
# remember `console_error_panic_hook::set_once()` themselves.
console_error_panic_hook = "0.1"
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
serde_json = "1"
serde-wasm-bindgen = { workspace = true }
once_cell = { workspace = true }
unicode-segmentation = "1"
# RFC 060 Tier 4 — `&'static phf::Map<&'static str,
# &'static ComponentVTable>` populated by the `app!{}` macro
# at expansion time from an explicit `components: [...]` list.
phf = { version = "0.13", features = ["macros"] }
# RFC-098 H4 — insertion-ordered subscriber sets + flush queue so a
# differential-fuzz failure replays from its seed alone (HashSet
# iteration order varied per run). Same asymptotics as HashSet.
indexmap = { workspace = true }
# RFC-098 H2 — one generational slab for the effect lifecycle
# (body + scheduler + cleanups + signal deps), replacing four parallel
# tables. EffectId = generation<<32 | slot; stale ids resolve to None.
slab = { workspace = true }
# RFC-101 P1 — inline the per-row RowInstance vecs (binding_cache,
# listener_routes) so a small row mounts with zero heap blocks.
smallvec = { workspace = true }

[dependencies.web-sys]
version = "0.3"
