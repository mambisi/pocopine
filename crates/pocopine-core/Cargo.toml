[package]
name = "pocopine-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Client-side reactive runtime for pocopine — a Rust/WASM port of Alpine.js."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Compile the devtools overlay (scope inspector + state panel).
# Default-on: most users develop with it. Turn off with
# `default-features = false` for minimal release bundles —
# devtools.rs is ~1200 LOC of UI shell + MutationObserver glue
# that's pure binary-size cost when unused.
default = ["devtools"]
devtools = []
mount-profiler = []

[dependencies]
pocopine-expr = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
serde_json = "1"
serde-wasm-bindgen = { workspace = true }
once_cell = { workspace = true }
unicode-segmentation = "1"

[dependencies.web-sys]
version = "0.3"
features = [
    "AddEventListenerOptions",
    "Animation",
    "AnimationEvent",
    "Attr",
    "Clipboard",
    "ClipboardEvent",
    "CompositionEvent",
    "console",
    "CssStyleDeclaration",
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "DocumentFragment",
    "DomRect",
    "DomRectReadOnly",
    "DomTokenList",
    "DragEvent",
    "Element",
    "ErrorEvent",
    "Event",
    "EventTarget",
    "FocusEvent",
    "HashChangeEvent",
    "Headers",
    "History",
    "HtmlAnchorElement",
    "HtmlCollection",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTemplateElement",
    "HtmlTextAreaElement",
    "InputEvent",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MediaQueryListEvent",
    "MessageEvent",
    "MouseEvent",
    "MutationObserver",
    "MutationObserverInit",
    "MutationRecord",
    "NamedNodeMap",
    "Navigator",
    "Node",
    "NodeList",
    "PageTransitionEvent",
    "Performance",
    "PointerEvent",
    "PopStateEvent",
    "ProgressEvent",
    "Request",
    "RequestInit",
    "RequestMode",
    "ResizeObserver",
    "ResizeObserverEntry",
    "ResizeObserverOptions",
    "Response",
    "StorageEvent",
    "SubmitEvent",
    "Text",
    "TouchEvent",
    "TransitionEvent",
    "UiEvent",
    "WheelEvent",
    "Window",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"
