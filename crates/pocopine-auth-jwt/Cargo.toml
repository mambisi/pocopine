[package]
name = "pocopine-auth-jwt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "JWT verification engine for pocopine-auth (Firebase, Clerk, Auth0, Supabase, custom OIDC, and pocopine-issued tokens)."

[dependencies]
pocopine-auth = { workspace = true }
pocopine-core = { workspace = true, default-features = false }
pocopine-observe = { workspace = true }
serde = { workspace = true }
serde_json = "1"

# Host-only: jsonwebtoken pulls in ring/rustls and isn't shaped for
# wasm32. Apps embed the verifier in their server bin only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jsonwebtoken = "9"
http = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["sync", "macros", "time"] }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
base64 = "0.22"
# Provider integration tests synthesize an RSA keypair + JWKS at
# test time so we don't carry binary fixtures. ~1.5s per run; a
# follow-up could share fixtures across providers if it gets slow.
rsa = "0.9"
rand = "0.8"
