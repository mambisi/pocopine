[package]
name = "pocopine-auth-credentials"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party email+password credentials core for pocopine — User, UserStore, TokenStore, argon2id, signup/login/logout routes shipping as a ServerPlugin."

# Host-only: argon2 + axum router + jsonwebtoken issuer are all
# server-side. Wasm bundles never carry this crate.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pocopine-auth = { workspace = true }
pocopine-auth-jwt = { workspace = true }
pocopine-core = { workspace = true, default-features = false }
pocopine-crypto = { workspace = true }
pocopine-server = { workspace = true }
serde = { workspace = true }
serde_json = "1"
http = { workspace = true }
axum = "0.7"
tower = "0.5"
tokio = { version = "1", features = ["sync", "macros", "time", "rt-multi-thread"] }
tracing = { workspace = true }
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "v7"] }
async-trait = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
