[package]
name = "pocopine-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Proc-macros for pocopine: #[component] and #[handlers]."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
# RFC 050 — compile-time HTML parser. Host-only (proc-macro crate),
# never linked into the consumer's wasm output.
html5ever = "0.27"
markup5ever_rcdom = "0.3"
# RFC 049 / RFC 050 §4.6 — rustc-flavoured diagnostic renderer.
# Host-only, same as the parser crates above.
annotate-snippets = "0.11"
