[package]
name = "pocopine-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Proc-macros for pocopine: #[component] and #[handlers]."

[lib]
proc-macro = true

[dependencies]
# RFC 054 — compile-time validation of `pp-for` row-plan
# expressions. Pure-Rust parser shared with the runtime.
pocopine-expr = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
# RFC 050 — compile-time `.poco` parser, now a shared host-only crate
# so build tooling (pocopine-stylekit) reuses it. Never linked into wasm.
pocopine-template-parser = { workspace = true }
# RFC 063 — the removed-directive table lives in the shared directive registry
# so the macro's hard-error scan and the language server stay in lockstep.
pocopine-directives = { workspace = true }
# RFC 049 / RFC 050 §4.6 — rustc-flavoured diagnostic renderer.
# Host-only, same as the parser crates above.
annotate-snippets = "0.11"
cron = { workspace = true }
pocopine-client-codegen = { workspace = true }
