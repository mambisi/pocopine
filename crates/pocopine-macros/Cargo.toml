[package]
name = "pocopine-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Proc-macros for pocopine: #[component] and #[handlers]."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
# RFC 050 — compile-time HTML parser. Host-only (proc-macro crate),
# never linked into the consumer's wasm output.
html5ever = "0.27"
markup5ever_rcdom = "0.3"
