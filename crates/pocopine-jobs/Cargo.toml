[package]
name = "pocopine-jobs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Background jobs for pocopine apps."

[features]
default = []
# RFC-123 Phase 4 — enqueue → run links: capture the enqueuer's W3C
# traceparent into the envelope and add it as a span link on
# pocopine.job.run. Dependency-only; enabled by `pocopine/logging-otlp`.
otel = ["dep:opentelemetry", "dep:tracing-opentelemetry"]

[dependencies]
serde = { workspace = true }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cron = { workspace = true }
inventory = { workspace = true }
redis = { version = "0.27", features = ["tokio-comp"] }
tokio = { version = "1", features = ["time"] }
tracing = { workspace = true }
pocopine-observe = { workspace = true }
opentelemetry = { version = "0.31", optional = true, features = ["trace"] }
tracing-opentelemetry = { version = "0.32", optional = true }
