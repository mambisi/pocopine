[package]
name = "pocopine-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Storage protocol, browser client, and server plugin extension for Pocopine apps."

[features]
# Exposes the browser transport override hook used by `tests/client_browser.rs`
# (and any downstream tus client harness). Gated to keep the MITM-capable
# `__set_browser_transport_for_test` setter out of production wasm bundles —
# without the feature, the slot is dead code and the setter does not exist
# in the public API.
test-utils = []

[dependencies]
base64 = "0.22"
bytes = "1"
pocopine-core = { workspace = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
time = { version = "0.3", features = ["serde", "formatting"] }
uuid = { version = "1", features = ["v4", "js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pocopine-server = { workspace = true }
pocopine-crypto = { workspace = true }
# `UploadBody` adapts the inbound axum request body into a provider-agnostic
# byte stream (Stream trait + map_err) so part uploads forward to the provider
# without buffering the whole part.
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
# Per-session async mutex (tokio::sync::Mutex) for the local-fs backend, plus
# spawn_blocking to keep the std::fs I/O off the tokio worker threads.
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
tower = { version = "0.5", features = ["util"] }

# Upload hot-path throughput benchmark (in-memory backend; host only).
[[bench]]
name = "upload"
harness = false

# Provider-write amplification: legacy O(n^2) rewrite vs native O(n) strategies.
[[bench]]
name = "amplification"
harness = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `FuturesUnordered` drives the bounded-concurrency multipart part uploads on
# the single wasm task (`alloc` feature only — no std, keeps the bundle lean).
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "Blob",
    "File",
    "Headers",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "Response",
    "Storage",
    "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
pocopine = { path = "../pocopine" }
wasm-bindgen-test = "0.3"

# Browser smoke tests for the storage client install a fake transport via the
# `test-utils` hook, so the test target must be built with that feature enabled.
# Invoke with: `wasm-pack test --firefox --headless crates/pocopine-storage \
#   --features test-utils --test client_browser`.
[[test]]
name = "client_browser"
path = "tests/client_browser.rs"
required-features = ["test-utils"]
