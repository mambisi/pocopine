[package]
name = "wasm_split_macros"
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Vendored macros for post-link WebAssembly splitting."
readme = "README.md"
# because we emit unsafe extern blocks/safe extern items
rust-version = "1.84"

[dependencies]
base16 = "0.2.1"
sha2 = "0.10.8"
# for proc macro support
quote = "1.0.36"
syn = { version = "2.0.108", features = ["full"] }

[lib]
proc-macro = true
