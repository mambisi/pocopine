[package]
name = "pocopine-auth-oauth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OAuth 2.0 Authorization Code + PKCE client (flow mechanism + token-store trait) for pocopine — drive a login or resolve a provider credential."

[dependencies]
# Host-only: the flow does HTTPS token exchange (reqwest) and reads the OS
# CSPRNG; it isn't shaped for wasm32. The whole crate is gated off wasm (the lib
# is empty there), matching pocopine-auth-jwt.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Shared secret primitive + sha256 (PKCE S256 challenge).
pocopine-crypto = { workspace = true }
# base64url (PKCE) + percent-encoding (URL query values).
pocopine-codec = { workspace = true }
serde = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
getrandom = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
# Mock the token endpoint for the flow tests (no network).
wiremock = "0.6"
