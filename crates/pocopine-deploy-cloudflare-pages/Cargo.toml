[package]
name = "pocopine-deploy-cloudflare-pages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "API-direct Cloudflare Pages static deploy adapter for pocopine (RFC 080)."

[dependencies]
anyhow = "1"
pocopine-codec = { workspace = true }
pocopine-crypto = { workspace = true }
pocopine-deploy = { workspace = true }
semver = { version = "1", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls-webpki-roots"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.8"
wiremock = "0.6"
