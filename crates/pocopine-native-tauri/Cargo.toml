[package]
name = "pocopine-native-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Tauri backend for the pocopine native target: webview window + custom-protocol server-function transport (RFC-104)."

[lib]
# The `tauri` webview backend for `pocopine-native`. `tauri` is an
# OPTIONAL dependency behind the (default-off) `tauri` feature so a
# stock `cargo build`/CI of the workspace never links webkit2gtk /
# libsoup. App `src-tauri` crates enable `features = ["tauri"]`. See
# RFC-104 §5.1.

[features]
default = []
# Pull in the real Tauri webview runtime. Links system webview
# libraries (webkit2gtk-4.1 on Linux); enable on a desktop host.
# `reqwest` is the server-mode proxy client (RFC-104) and rides the same
# feature — it's only used when a window actually runs.
tauri = ["dep:tauri", "dep:reqwest", "dep:rustls"]

[dependencies]
pocopine-native = { path = "../pocopine-native" }
pocopine-server = { workspace = true }
http = { workspace = true }
tracing = { workspace = true }
tauri = { version = "2", optional = true }
# Forwards `#[server]` calls to a deployed backend in "server" mode.
# Host-side (no browser CORS); rustls to avoid OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
# Install an explicit rustls CryptoProvider: the workspace pulls in both
# aws-lc-rs and ring transitively, so rustls 0.23 can't auto-select one
# and panics at first TLS use without `install_default()`.
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
