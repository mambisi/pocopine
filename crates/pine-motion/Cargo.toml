[package]
name = "pine-motion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Motion.dev-style animation library for pocopine — springs, gestures, drag, scroll, and shared-layout projection built on top of pocopine-core's WAAPI primitives."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pocopine-core = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }

[dependencies.web-sys]
version = "0.3"
features = [
    "CssStyleDeclaration",
    "Element",
    "Event",
    "EventTarget",
    "FocusEvent",
    "HtmlElement",
    "Node",
    "Performance",
    "PointerEvent",
    "Window",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"
