[package]
name = "pine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Unstyled, accessible UI components for pocopine — headless primitives (Button, Dialog, Popover, …) ready to style."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pocopine = { path = "../pocopine" }
pocopine-core = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
time = { version = "0.3", default-features = false, features = ["wasm-bindgen", "parsing", "macros"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "CustomEvent",
    "Element",
    "Event",
    "EventInit",
    "EventTarget",
    "FocusEvent",
    "FocusEventInit",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "KeyboardEventInit",
    "MouseEvent",
    "PointerEvent",
    "PointerEventInit",
    "Window",
    "console",
]

[dev-dependencies]
pocopine-core = { workspace = true }
serde = { workspace = true }
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = { workspace = true }
