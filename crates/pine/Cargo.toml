[package]
name = "pine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Unstyled, accessible UI components for pocopine — headless primitives (Button, Dialog, Popover, …) ready to style."
# Held back from the crates.io launch: the bare name `pine` is already taken on
# crates.io. Nothing in the workspace depends on this crate, so skipping it does
# not block the rest. Pick an available name (e.g. `pocopine-pine`) to publish it.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
pocopine = { path = "../pocopine" }
pocopine-core = { workspace = true }
pocopine-storage = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
time = { version = "0.3", default-features = false, features = ["wasm-bindgen", "parsing", "macros"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "CustomEvent",
    "DataTransfer",
    "DragEvent",
    "Element",
    "Event",
    "EventInit",
    "EventTarget",
    "AbortController",
    "AbortSignal",
    "Blob",
    "File",
    "FileList",
    "FocusEvent",
    "FocusEventInit",
    "CssStyleDeclaration",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "InputEvent",
    "KeyboardEvent",
    "KeyboardEventInit",
    "MouseEvent",
    "MouseEventInit",
    "PointerEvent",
    "PointerEventInit",
    "UiEvent",
    "Window",
    "console",
]

[dev-dependencies]
pocopine-core = { workspace = true }
serde = { workspace = true }
serde_json = "1"
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = { workspace = true }
