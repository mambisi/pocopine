[package]
name = "pine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Unstyled, accessible UI components for pocopine — headless primitives (Button, Dialog, Popover, …) ready to style."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Forwards `pocopine`'s `legacy-dom` feature so test runs of
# Pine compounds (16 of which still need walker fallback for
# their lifted-`pp-if`/`pp-teleport` body content — see the
# Pine fallback audit) can opt into the runtime walker. Most
# Pine compounds are walker-clean and don't need this; the
# audit-tracked subset (portals, `*-content`, `*-indicator`,
# `*-value`) does until the body-lift envelope expands.
legacy-dom = ["pocopine/legacy-dom"]

[dependencies]
pocopine = { path = "../pocopine" }
pocopine-core = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
time = { version = "0.3", default-features = false, features = ["wasm-bindgen", "parsing", "macros"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "CustomEvent",
    "Element",
    "Event",
    "EventInit",
    "EventTarget",
    "FocusEvent",
    "FocusEventInit",
    "HtmlElement",
    "HtmlInputElement",
    "InputEvent",
    "KeyboardEvent",
    "KeyboardEventInit",
    "MouseEvent",
    "MouseEventInit",
    "PointerEvent",
    "PointerEventInit",
    "UiEvent",
    "Window",
    "console",
]

[dev-dependencies]
pocopine-core = { workspace = true }
serde = { workspace = true }
serde_json = "1"
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = { workspace = true }
