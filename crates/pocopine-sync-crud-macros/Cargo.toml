[package]
name = "pocopine-sync-crud-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Proc-macros for typed Pocopine sync CRUD resources."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
# `extra-traits` enables `Debug`/`PartialEq` on syn types so the
# macro's internal data structures (which embed `syn::Type` /
# `syn::LitStr`) can derive `Debug` for the unit-test
# `unwrap_err` calls. Proc-macro-only dep; no runtime impact.
syn = { workspace = true, features = ["extra-traits"] }

[dev-dependencies]
js-sys = { workspace = true }
pocopine-auth = { workspace = true }
pocopine-core = { workspace = true }
pocopine-sync = { workspace = true }
pocopine-sync-crud = { workspace = true }
serde = { workspace = true }
tokio = { version = "1", features = ["macros", "rt"] }
trybuild = "1"
wasm-bindgen = { workspace = true }
