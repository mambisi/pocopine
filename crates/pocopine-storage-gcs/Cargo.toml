[package]
name = "pocopine-storage-gcs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Google Cloud Storage backend adapter for pocopine-storage."

[dependencies]
bytes = "1"
google-cloud-storage = "1"
google-cloud-gax = "1"
percent-encoding = "2"
pocopine-storage = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", default-features = false, features = ["sync"] }
tracing = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
google-cloud-auth = "1"
testcontainers = { version = "0.23", features = ["http_wait"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
