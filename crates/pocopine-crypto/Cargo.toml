[package]
name = "pocopine-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Centralized cryptographic hash and checksum primitives for the pocopine workspace."

[dependencies]
# `no_std` + `alloc`: all digest/checksum crates build without `std` (the
# hashers lose only runtime CPU-feature detection / SIMD acceleration, never
# correctness).
blake3 = { version = "1", default-features = false }
sha2 = { version = "0.10", default-features = false }
md-5 = { version = "0.10", default-features = false }
crc32c = { version = "0.6", default-features = false }
hmac = { version = "0.12", default-features = false }
# Zeroize-on-drop backing for the `SecretString` in-memory secret primitive.
# `alloc` gives the `String`/`Vec` zeroize impls; no `std` needed.
zeroize = { version = "1", default-features = false, features = ["alloc"] }
