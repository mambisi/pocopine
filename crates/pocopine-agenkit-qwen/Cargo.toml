[package]
name = "pocopine-agenkit-qwen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party Qwen/DashScope provider for Pocopine Agenkit. Wraps the OpenAI-compatible Chat Completions provider with Qwen defaults, model handles, and server-only credentials."

# Host-only: depends on the host-side pocopine-agenkit runtime + reqwest, which
# do not build for wasm32. The browser never calls a provider directly (§D10).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pocopine-agenkit = { workspace = true }
pocopine-agenkit-core = { workspace = true }
pocopine-agenkit-oai = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls-webpki-roots",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
futures = "0.3"
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
wiremock = "0.6"
