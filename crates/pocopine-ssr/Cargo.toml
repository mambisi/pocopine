[package]
name = "pocopine-ssr"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Server-side rendering (RFC-099) for pocopine — stamps compiled template plans to HTML host-side. Host-only; never linked into wasm output."

[dependencies]
# Host build of the runtime — plan types + the host expr evaluator
# (RFC-099 P1b) + the JS number formatter (P1a). `default-features =
# false` (set at the workspace level) keeps devtools/wasm bits out.
pocopine-core = { workspace = true }
pocopine-expr = { workspace = true }
serde_json = "1"
# Host HTML parse → mutate → serialize. Same versions as
# pocopine-template-parser so the workspace resolves one copy.
html5ever = "0.27"
markup5ever_rcdom = "0.3"
