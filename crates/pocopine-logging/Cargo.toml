[package]
name = "pocopine-logging"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Logging adapters for pocopine server and browser applications."

[features]
default = []
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
    "pocopine-server/otel",
]

[dependencies]
pocopine-observe = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pocopine-server = { workspace = true }
serde_json = "1"
opentelemetry = { version = "0.31", optional = true, features = ["trace"] }
opentelemetry-otlp = { version = "0.31", optional = true, default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.31", optional = true, features = ["trace"] }
tracing-subscriber = { version = "0.3", features = ["ansi", "env-filter", "fmt", "json"] }
tracing-opentelemetry = { version = "0.32", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
pocopine-core = { workspace = true, default-features = false }
js-sys = { workspace = true }
serde_json = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
# RFC-123 §5.5 — the trace relay posts closed client spans with a raw
# `fetch` (never through the server-function client, which would open
# spans of its own) and `sendBeacon` on page hide.
web-sys = { version = "0.3", features = [
    "console",
    "EventTarget",
    "Headers",
    "Navigator",
    "Request",
    "RequestInit",
    "Response",
    "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pocopine-observe = { workspace = true, features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
# The `otlp` relay test exports through an in-memory span exporter.
opentelemetry_sdk = { version = "0.31", features = ["trace", "testing"] }
