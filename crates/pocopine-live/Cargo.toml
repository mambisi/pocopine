[package]
name = "pocopine-live"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser live invalidation streams for pocopine apps."

[features]
default = []
redis = ["pocopine-events/redis"]

[dependencies]
pocopine-auth = { workspace = true }
pocopine-core = { workspace = true }
pocopine-events = { workspace = true }
pocopine-observe = { workspace = true }
serde = { workspace = true }
serde_json = "1"
tracing = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
web-sys = { version = "0.3", features = [
    "ErrorEvent",
    "Event",
    "EventSource",
    "EventSourceInit",
    "EventTarget",
    "MessageEvent",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.7"
futures-util = "0.3"
serde_urlencoded = "0.7"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
http-body-util = "0.1"
pocopine-observe = { workspace = true, features = ["test-support"] }
pocopine-server = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "time"] }
tower = { version = "0.5", features = ["util"] }
