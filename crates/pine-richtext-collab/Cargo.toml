[package]
name = "pine-richtext-collab"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Codec + binding between the pine-richtext ProseMirror model and a yrs CRDT (live blocks)."

# Target-agnostic by design: the codec is one Rust crate compiled twice — host
# (SSR / persistence / server-authored docs) and wasm32 (the browser editor).
# Both pine-richtext (model) and yrs build for wasm, so no cfg gate here.
[dependencies]
pine-richtext = { workspace = true }
yrs = "0.27"
serde = { workspace = true }
serde_json = "1"

# The `client` module (collab sync driver + wasm connection) is the browser
# editor's transport integration. Its deps are wasm-only so a pure host consumer
# of the codec (SSR) does not drag in the realtime/collab server stack; the
# driver is still host-tested via the dev-deps below (`mod client` is cfg'd to
# wasm-OR-test).
[target.'cfg(target_arch = "wasm32")'.dependencies]
bytes = "1"
tracing = { workspace = true }
pocopine-collab = { workspace = true }
pocopine-realtime = { workspace = true }

[dev-dependencies]
bytes = "1"
pocopine-collab = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
