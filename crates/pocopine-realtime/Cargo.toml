[package]
name = "pocopine-realtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Generic bidirectional realtime gateway (WebSocket transport) for pocopine apps (RFC 073)."

[features]
default = []
# Native Redis-backed Fanout for multi-process fan-out (RFC 073 Phase C).
redis = ["dep:redis"]

# Shared by the `protocol` codec + the `client` session (host AND wasm). tracing
# is shared too — the wasm transport logs dropped frames per the logging rule.
[dependencies]
bytes = "1"
serde = { workspace = true }
serde_json = "1"
tracing = { workspace = true }

# The `server` gateway is host-only (axum WebSocket server). One cfg gate, the
# client-server-modules convention: on wasm32 the crate is protocol + client.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
async-trait = "0.1"
redis = { version = "0.27", features = [
    "tokio-comp",
    "connection-manager",
], optional = true }
pocopine-auth = { workspace = true }
pocopine-events = { workspace = true }
pocopine-observe = { workspace = true }
pocopine-crypto = { workspace = true }

# The `client` WebSocket I/O shell (wasm32 only).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "ErrorEvent",
    "CloseEvent",
    "Event",
    "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "sync",
    "net",
] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
redis = { version = "0.27", features = ["tokio-comp"] }
bytes = "1"
async-trait = "0.1"
pocopine-events = { workspace = true }
