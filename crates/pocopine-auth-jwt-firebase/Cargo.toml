[package]
name = "pocopine-auth-jwt-firebase"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Firebase Authentication ID-token verifier preset for pocopine-auth-jwt."

# Host-only: the underlying verifier engine pulls in `jsonwebtoken`
# / `ring` / `rustls`, which don't compile to wasm32. Apps embed
# this in their server bin only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pocopine-auth-jwt = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pocopine-auth = { workspace = true }
pocopine-auth-jwt = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { workspace = true }
serde_json = "1"
# RFC-074 §5.3.1 mandates a recorded-token integration test for
# every in-tree provider preset. The test synthesizes an RSA
# keypair and a static JWKS at test time so we don't carry binary
# fixtures (~1.5s per run).
jsonwebtoken = "9"
base64 = "0.22"
rsa = "0.9"
rand = "0.8"
