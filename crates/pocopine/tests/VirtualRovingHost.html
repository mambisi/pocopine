<div class="vrv-root">
  <input class="vrv-input"
         type="text"
         role="combobox"
         aria-controls="vrv-listbox"
         pp-roving:vrv-listbox.virtual>
  <ul id="vrv-listbox" class="vrv-list" role="listbox">
    <li class="vrv-item" role="option" id="vrv-opt-1">Apple</li>
    <li class="vrv-item" role="option" id="vrv-opt-2">Banana</li>
    <li class="vrv-item" role="option" id="vrv-opt-3" aria-disabled="true">Carrot</li>
    <li class="vrv-item" role="option" id="vrv-opt-4" hidden>Durian</li>
    <li class="vrv-item" role="option" id="vrv-opt-5">Elderberry</li>
  </ul>
</div>
