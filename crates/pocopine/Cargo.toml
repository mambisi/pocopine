[package]
name = "pocopine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust/WASM framework with an Alpine.js-style client runtime."

[features]
# RFC-058 Phase 6.5 — pure compiled-views runtime. Consumers
# opt into `devtools` (in-browser scope inspector) and
# `mount-profiler` (per-mount timing instrumentation).
default = ["runtime-expr-fallback"]
analytics = ["dep:pocopine-analytics", "observe"]
devtools = ["pocopine-core/devtools"]
logging = ["dep:pocopine-logging", "observe"]
logging-otlp = ["logging", "pocopine-logging/otlp"]
live = ["dep:pocopine-live"]
live-redis = ["live", "pocopine-live/redis"]
mount-profiler = ["pocopine-core/mount-profiler"]
observe = ["dep:pocopine-observe"]
runtime-expr-fallback = ["pocopine-core/runtime-expr-fallback"]

[dependencies]
pocopine-analytics = { workspace = true, optional = true }
pocopine-auth = { workspace = true }
pocopine-core = { workspace = true, default-features = false }
pocopine-jobs = { workspace = true }
pocopine-live = { workspace = true, optional = true }
pocopine-logging = { workspace = true, optional = true }
pocopine-macros = { workspace = true }
pocopine-observe = { workspace = true, optional = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
web-sys = { version = "0.3", features = ["Element"] }
# RFC 060 Tier 4 — re-exported via `__private::phf` for the
# `app!{}` macro's expansion site.
phf = { version = "0.13", features = ["macros"] }

[dev-dependencies]
pocopine-server = { path = "../pocopine-server" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = [
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "Element",
    "EventTarget",
    "HtmlElement",
    "CssStyleDeclaration",
    "KeyboardEvent",
    "KeyboardEventInit",
    "Node",
    "NodeList",
    "Window",
] }

# Redis-backed integration tests spin up a throwaway Redis container per
# test binary via testcontainers; no external Redis dependency for CI.
# Host-only — the wasm32 test build can't reach Docker, and tokio's
# `rt-multi-thread` feature is incompatible with the wasm target.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# trybuild shells out to cargo (std::process::Command) and reads files
# — host-only; the RFC-097 compile-fail driver (field_handles_ui.rs) is
# gated to non-wasm to match.
trybuild = "1"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["redis"] }
redis = { version = "0.27", features = ["tokio-comp"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
