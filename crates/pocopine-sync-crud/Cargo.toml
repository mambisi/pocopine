[package]
name = "pocopine-sync-crud"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed local-first CRUD contracts for Pocopine sync."

[dependencies]
pocopine-sync-crud-macros = { workspace = true }
pocopine-core = { workspace = true }
pocopine-sync = { workspace = true }
serde = { workspace = true }
uuid = { version = "1", features = ["v4", "js", "serde"] }

[dev-dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-trait = "0.1"
pocopine-auth = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
http-body-util = "0.1"
http = { workspace = true }
pocopine-events = { workspace = true }
pocopine-live = { workspace = true }
pocopine-server = { workspace = true }
pocopine-sync-query = { workspace = true }
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
