[package]
name = "pocopine-deploy-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Render.com deploy adapter for pocopine (RFC 080 §6). Talks to api.render.com/v1 directly; no Render CLI required."

[dependencies]
anyhow = "1"
pocopine-deploy = { workspace = true }
semver = { version = "1", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
tracing = { workspace = true }

# Render's API is host-only. Matches pocopine-deploy-railway's gate so
# `cargo check --target wasm32-unknown-unknown` stays clean.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }
indicatif = "0.17"

# Host-only: wiremock + tokio's rt-multi-thread pull in mio (no wasm32 backend).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pocopine-crypto = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
