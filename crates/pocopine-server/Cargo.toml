[package]
name = "pocopine-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-side helpers for pocopine server functions (axum integration, static-file serving)."

# Skip this crate entirely on wasm32 — its deps (axum, tokio) don't compile
# for that target. Users who want server functions build their server binary
# on the host, client bundle on wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
serde_json = "1"
tracing = { workspace = true }
inventory = { workspace = true }
# RFC-100 Mode B — the `/assets/<hash>/<path>` private-bucket proxy
# (src/assets.rs) reads objects through the shared AssetStore. Pulls
# the aws-sdk-s3 stack into every server build; accepted cost for the
# zero-config asset tier (the route only activates when
# POCOPINE_ASSETS_BUCKET is set).
pocopine-assets = { workspace = true }

[dependencies]
pocopine-auth = { workspace = true }
serde = { workspace = true }

# Host-only tests (the crate is empty on wasm32, see lib.rs cfg).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
