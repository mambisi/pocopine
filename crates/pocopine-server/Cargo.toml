[package]
name = "pocopine-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-side helpers for pocopine server functions (axum integration, static-file serving)."

# Skip this crate entirely on wasm32 — its deps (axum, tokio) don't compile
# for that target. Users who want server functions build their server binary
# on the host, client bundle on wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
# RFC-123 Phase 4 — the request span wraps the response body (SpannedBody).
http-body = "1"
serde_json = "1"
tracing = { workspace = true }
inventory = { workspace = true }
pocopine-observe = { workspace = true }
# RFC-123 §5.3 — `otel` feature: W3C `traceparent` in/out on the request
# span. Dependency-only; enabled by `pocopine-logging/otlp`.
opentelemetry = { version = "0.31", optional = true, features = ["trace"] }
tracing-opentelemetry = { version = "0.32", optional = true }
# RFC-107 — streaming server functions: the SSE response helper frames a
# `StreamServerResult<T>` into `axum::response::Sse`.
pocopine-core = { workspace = true }
futures = "0.3"
# RFC-100 Mode B — the `/assets/<hash>/<path>` private-bucket proxy
# (src/assets.rs) reads objects through the shared AssetStore. Pulls
# the aws-sdk-s3 stack into every server build; accepted cost for the
# zero-config asset tier (the route only activates when
# POCOPINE_ASSETS_BUCKET is set).
pocopine-assets = { workspace = true }

[features]
default = []
otel = ["dep:opentelemetry", "dep:tracing-opentelemetry"]

[dependencies]
pocopine-auth = { workspace = true }
serde = { workspace = true }

# Host-only tests (the crate is empty on wasm32, see lib.rs cfg).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
tracing-subscriber = { workspace = true, features = ["registry", "std"] }
# RFC-123 §5.3 test support: an in-process tracer provider for the
# `otel` feature's traceparent round-trip test (no exporter needed).
opentelemetry_sdk = { version = "0.31", features = ["trace"] }
http-body-util = "0.1"
