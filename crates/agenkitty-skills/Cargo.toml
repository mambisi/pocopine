[package]
name = "agenkitty-skills"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent Skills (agentskills.io) loader library for the Agenkitty framework: discovery, validation, and progressive-disclosure reads. The CLI surface is the `agenkitty skills` subcommand."

[dependencies]
# `looks_like_secret` — the one shared secret-content classifier (F3). The
# always-on skill index runs frontmatter text through it (RFC-121 S2).
agenkitty-core = { workspace = true }
# sha256 skill digests (house rule: all hashing through pocopine-crypto).
pocopine-crypto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# SKILL.md frontmatter is YAML per the agentskills.io spec. serde_norway is
# the maintained drop-in fork of the archived serde_yaml; it is confined to
# `frontmatter.rs` (raw values are converted to `serde_json::Value` at the
# public surface) so it stays swappable.
serde_norway = "0.9"

[dev-dependencies]
tempfile = "3"
