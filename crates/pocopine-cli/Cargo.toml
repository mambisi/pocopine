[package]
name = "pocopine-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for pocopine projects: build, run, dev."

[[bin]]
name = "pocopine"
path = "src/main.rs"

[dependencies]
# Build-time precompression of the hashed bundle pair (see build::precompress).
# Both are already in the graph transitively, so this adds no new crates.
brotli = "8"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
tiny_http = "0.12"
notify = "6"
anyhow = "1"
pocopine-client-codegen = { workspace = true }
pocopine-stylekit = { workspace = true }
pocopine-locale = { workspace = true }
# RFC-116 — `inline-scan` locates `poco!` bodies in `.rs` sources for
# Stylekit extraction and LSP diagnostics.
pocopine-template-parser = { workspace = true, features = ["inline-scan"] }
# RFC-117 rule 3 — HTML formatter (MIT). Library-first; the dprint plugin is
# a separate wrapper. Validated whitespace-only against every .poco in-repo.
markup_fmt = "0.27"
pocopine-expr = { workspace = true }
pocopine-directives = { workspace = true }
# `pocopine lsp` — editor language server over stdio. tower-lsp brings its own
# lsp-types + jsonrpc; tokio (io-std) drives the stdio transport. `syn` parses
# `.rs` sources for the server's `#[component]` index; `proc-macro2`'s
# span-locations give those items line/col for goto-definition.
syn = { workspace = true }
proc-macro2 = { version = "1", features = ["span-locations"] }
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "sync"] }
# RFC-100 — the dev server verifies `/assets/<hash>/<path>` URLs
# against the file bytes (8-hex sha256 prefix, same shape as
# `pocopine_core::assets::asset_hash`); the build paths fingerprint
# the assets/ tree; `pocopine assets push` hash-diff-syncs it to the
# configured S3-compatible bucket through the shared AssetStore.
pocopine-assets = { workspace = true }
pocopine-crypto = { workspace = true }
pocopine-deploy = { workspace = true }
pocopine-deploy-cloudflare-pages = { workspace = true }
pocopine-deploy-railway = { workspace = true }
pocopine-deploy-render = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
# RFC-100 — `tests/assets_push_minio.rs` drives the real binary
# against a MinIO testcontainer (same pattern as
# pocopine-storage-s3/tests/minio.rs). Needs a Docker daemon.
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["minio"] }

# The CLI itself is host-only; reqwest is only used when downloading
# the Tailwind standalone binary. Target-gated so `cargo check
# --target wasm32 --workspace` stays happy.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
