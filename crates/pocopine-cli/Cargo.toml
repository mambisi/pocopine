[package]
name = "pocopine-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for pocopine projects: build, run, dev."

[[bin]]
name = "pocopine"
path = "src/main.rs"

# `pp` is a short alias for `pocopine` — same binary, e.g. `pp new`, `pp dev`.
[[bin]]
name = "pp"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
tiny_http = "0.12"
notify = "6"
anyhow = "1"
pocopine-client-codegen = { workspace = true }
pocopine-stylekit = { workspace = true }
pocopine-deploy = { workspace = true }
pocopine-deploy-railway = { workspace = true }
pocopine-deploy-render = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

# The CLI itself is host-only; reqwest is only used when downloading
# the Tailwind standalone binary. Target-gated so `cargo check
# --target wasm32 --workspace` stays happy.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
