[package]
name = "pocopine-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for pocopine projects: build, run, dev."

[[bin]]
name = "pocopine"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"
notify = "6"
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

# The CLI itself is host-only; reqwest is only used when downloading
# the Tailwind standalone binary. Target-gated so `cargo check
# --target wasm32 --workspace` stays happy.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
