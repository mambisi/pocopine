pine-richtext-collab = { path = "crates/pine-richtext-collab", version = "0.2.0" }
pine-richtext-extensions = { path = "crates/pine-richtext-extensions", version = "0.2.0" }
pine-richtext-macros = { path = "crates/pine-richtext-macros", version = "0.2.0" }
# RFC-098 — insertion-ordered subscriber/queue sets (H4 determinism)
# and the generational effect slab (H2). indexmap keeps its `std`
# default (the `RandomState` hasher + `IndexSet::new()`); iteration is
# insertion-ordered regardless of hasher. Both are wasm32-proven.
indexmap = { version = "2" }
slab = { version = "0.4" }
# RFC-101 P1 — inline per-row RowInstance vecs (binding_cache,
# listener_routes) so the common small row mounts with zero heap blocks.
smallvec = { version = "1" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
http = "1"
inventory = "0.3"
linkme = "0.3"
once_cell = "1"
proc-macro2 = "1"
prettyplease = "0.2"
quote = "1"
syn = { version = "2", features = ["full"] }
strsim = "0.11"
cron = "0.12"
askama = { version = "0.16", default-features = false, features = ["std", "derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
# Zeroize-on-drop for in-memory secrets (provider credentials, §D10).
zeroize = { version = "1", features = ["zeroize_derive"] }

# RFC-058 Phase 6.5 — match Yew's release-profile knobs.
# `opt-level = "z"` collapses size-vs-speed in favour of size;
# `lto = true` lets the linker inline + dead-code-eliminate
# across crate boundaries; `codegen-units = 1` removes the
# parallelism-granularity barrier that prevents LTO from
# seeing the whole tree; `panic = "abort"` is a no-op on
# `wasm32-unknown-unknown` (the target already aborts) but
# keeps the profile portable to other targets.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
