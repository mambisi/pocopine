[workspace]
resolver = "2"
members = [
    "crates/pine",
    "crates/pine-icons",
    "crates/pine-icons-macros",
    "crates/pine-motion",
    "crates/pocopine",
    "crates/pocopine-cli",
    "crates/pocopine-core",
    "crates/pocopine-expr",
    "crates/pocopine-macros",
    "crates/pocopine-server",
    "examples/blog",
    "examples/counter",
    "examples/hn",
    "jsbench/pocopine",
    "jsbench/leptos",
    "jsbench/yew",
    "jsbench/tags_input_repro",
    "examples/website",
    "examples/site",
    "examples/spa",
    "examples/tailwind",
    "examples/todo",
]

# The CLI builds for the host; everything else builds for wasm32. Exclude the
# CLI's own target dir from default wasm builds so `cargo build -p counter
# --target wasm32-unknown-unknown` doesn't pull in host-only deps.
[workspace.metadata.hosts]
cli = ["pocopine-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mambisi/pocopine"

[workspace.dependencies]
# `default-features = false` at the workspace level so per-crate
# `default-features = false` opt-outs actually take effect. Users
# of `pocopine` get devtools on by default via its own `default`
# feature, which forwards `pocopine-core/devtools`.
pocopine-core = { path = "crates/pocopine-core", version = "0.1.0", default-features = false }
pocopine-expr = { path = "crates/pocopine-expr", version = "0.1.0" }
pocopine-macros = { path = "crates/pocopine-macros", version = "0.1.0" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
linkme = "0.3"
once_cell = "1"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
strsim = "0.11"

# RFC-058 Phase 6.5 — match Yew's release-profile knobs.
# `opt-level = "z"` collapses size-vs-speed in favour of size;
# `lto = true` lets the linker inline + dead-code-eliminate
# across crate boundaries; `codegen-units = 1` removes the
# parallelism-granularity barrier that prevents LTO from
# seeing the whole tree; `panic = "abort"` is a no-op on
# `wasm32-unknown-unknown` (the target already aborts) but
# keeps the profile portable to other targets.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
