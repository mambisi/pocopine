# RFC-104 native host crate (Tauri shell for the file-browser example).
# Excluded so a stock `cargo build`/CI never links the Tauri webview
# backend; build it with `pocopine native dev --path examples/file-browser`
# on a webview-capable host.
exclude = [
    "examples/file-browser/src-tauri",
]

# The CLI builds for the host; everything else builds for wasm32. Exclude the
# CLI's own target dir from default wasm builds so `cargo build -p counter
# --target wasm32-unknown-unknown` doesn't pull in host-only deps.
[workspace.metadata.hosts]
cli = ["pocopine-cli", "gen-model-catalog", "agenkitty"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mambisi/pocopine"

[workspace.dependencies]
# `default-features = false` at the workspace level so per-crate
# `default-features = false` opt-outs actually take effect. Users
# of `pocopine` get devtools on by default via its own `default`
# feature, which forwards `pocopine-core/devtools`.
pocopine-agenkit = { path = "crates/pocopine-agenkit", version = "0.2.0" }
pocopine-agenkit-core = { path = "crates/pocopine-agenkit-core", version = "0.2.0" }
agenkitty-core = { path = "crates/agenkitty-core", version = "0.2.0" }
agenkitty-skills = { path = "crates/agenkitty-skills", version = "0.2.0" }
pocopine-agenkit-anthropic = { path = "crates/pocopine-agenkit-anthropic", version = "0.2.0" }
