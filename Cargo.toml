[workspace]
resolver = "2"
members = [
    "crates/pine",
    "crates/pine-charts",
    "crates/pine-icons",
    "crates/pine-icons-macros",
    "crates/pine-motion",
    "crates/pine-richtext",
    "crates/pocopine",
    "crates/pocopine-analytics",
    "crates/pocopine-auth",
    "crates/pocopine-auth-client",
    "crates/pocopine-auth-credentials",
    "crates/pocopine-auth-jwt",
    "crates/pocopine-client-codegen",
    "crates/pocopine-cli",
    "crates/pocopine-core",
    "crates/pocopine-deploy",
    "crates/pocopine-deploy-fly",
    "crates/pocopine-deploy-railway",
    "crates/pocopine-deploy-render",
    "crates/pocopine-events",
    "crates/pocopine-expr",
    "crates/pocopine-jobs",
    "crates/pocopine-launcher",
    "crates/pocopine-live",
    "crates/pocopine-logging",
    "crates/pocopine-macros",
    "crates/pocopine-observe",
    "crates/pocopine-server",
    "crates/pocopine-storage",
    "crates/pocopine-storage-azure",
    "crates/pocopine-storage-gcs",
    "crates/pocopine-storage-s3",
    "crates/pocopine-sync",
    # RFC 090 Phase 6: pocopine-sync-crud + pocopine-sync-crud-macros +
    # pocopine-sync-sqlx (CRUD-specific) deleted. The Source/MutationLog
    # types in pocopine_sync_query::write supersede them; the macro-
    # emitted typed write API replaces hand-built CrudMutationPayload.
    # See docs/sync-crud-to-query-migration.md (Phase 5) for the
    # migration path.
    "crates/pocopine-sync-indexdb",
    "crates/pocopine-sync-query",
    "crates/pocopine-sync-query-macros",
    "crates/pocopine-sync-sqlite",
    "crates/pocopine-ts-rs",
    "crates/pocopine-ts-rs-macros",
    "examples/blog",
    "examples/charts",
    "examples/counter",
    "examples/file-browser",
    "examples/hn",
    "examples/keep",
    "examples/live",
    "examples/observability-frontend",
    "examples/observability-smoke",
    "jsbench/pocopine",
    "jsbench/leptos",
    "jsbench/yew",
    "jsbench/tags_input_repro",
    "examples/website",
    "examples/richtext",
    "examples/site",
    "examples/spa",
    "examples/sync",
    "examples/tailwind",
    "examples/todo",
]

# The CLI builds for the host; everything else builds for wasm32. Exclude the
# CLI's own target dir from default wasm builds so `cargo build -p counter
# --target wasm32-unknown-unknown` doesn't pull in host-only deps.
[workspace.metadata.hosts]
cli = ["pocopine-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mambisi/pocopine"

[workspace.dependencies]
# `default-features = false` at the workspace level so per-crate
# `default-features = false` opt-outs actually take effect. Users
# of `pocopine` get devtools on by default via its own `default`
# feature, which forwards `pocopine-core/devtools`.
pocopine-analytics = { path = "crates/pocopine-analytics", version = "0.1.0" }
pocopine-auth = { path = "crates/pocopine-auth", version = "0.1.0" }
pocopine-auth-client = { path = "crates/pocopine-auth-client", version = "0.1.0" }
pocopine-auth-credentials = { path = "crates/pocopine-auth-credentials", version = "0.1.0" }
pocopine-auth-jwt = { path = "crates/pocopine-auth-jwt", version = "0.1.0" }
pocopine-client-codegen = { path = "crates/pocopine-client-codegen", version = "0.1.0" }
pocopine-core = { path = "crates/pocopine-core", version = "0.1.0", default-features = false }
pocopine-deploy = { path = "crates/pocopine-deploy", version = "0.1.0" }
pocopine-deploy-fly = { path = "crates/pocopine-deploy-fly", version = "0.1.0" }
pocopine-deploy-railway = { path = "crates/pocopine-deploy-railway", version = "0.1.0" }
pocopine-deploy-render = { path = "crates/pocopine-deploy-render", version = "0.1.0" }
pocopine-events = { path = "crates/pocopine-events", version = "0.1.0" }
pocopine-expr = { path = "crates/pocopine-expr", version = "0.1.0" }
pocopine-jobs = { path = "crates/pocopine-jobs", version = "0.1.0" }
pocopine-live = { path = "crates/pocopine-live", version = "0.1.0" }
pocopine-logging = { path = "crates/pocopine-logging", version = "0.1.0" }
pocopine-macros = { path = "crates/pocopine-macros", version = "0.1.0" }
pocopine-observe = { path = "crates/pocopine-observe", version = "0.1.0" }
pocopine-server = { path = "crates/pocopine-server", version = "0.1.0" }
pocopine-storage = { path = "crates/pocopine-storage", version = "0.1.0" }
pocopine-storage-azure = { path = "crates/pocopine-storage-azure", version = "0.1.0" }
pocopine-storage-gcs = { path = "crates/pocopine-storage-gcs", version = "0.1.0" }
pocopine-storage-s3 = { path = "crates/pocopine-storage-s3", version = "0.1.0" }
pocopine-sync = { path = "crates/pocopine-sync", version = "0.1.0" }
pocopine-sync-indexdb = { path = "crates/pocopine-sync-indexdb", version = "0.1.0" }
pocopine-sync-query = { path = "crates/pocopine-sync-query", version = "0.1.0" }
pocopine-sync-query-macros = { path = "crates/pocopine-sync-query-macros", version = "0.1.0" }
pocopine-sync-sqlite = { path = "crates/pocopine-sync-sqlite", version = "0.1.0" }
pocopine-ts-rs = { path = "crates/pocopine-ts-rs", version = "0.1.0" }
pine-richtext = { path = "crates/pine-richtext", version = "0.1.0" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
http = "1"
inventory = "0.3"
linkme = "0.3"
once_cell = "1"
proc-macro2 = "1"
prettyplease = "0.2"
quote = "1"
syn = { version = "2", features = ["full"] }
strsim = "0.11"
cron = "0.12"
askama = { version = "0.16", default-features = false, features = ["std", "derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }

# RFC-058 Phase 6.5 — match Yew's release-profile knobs.
# `opt-level = "z"` collapses size-vs-speed in favour of size;
# `lto = true` lets the linker inline + dead-code-eliminate
# across crate boundaries; `codegen-units = 1` removes the
# parallelism-granularity barrier that prevents LTO from
# seeing the whole tree; `panic = "abort"` is a no-op on
# `wasm32-unknown-unknown` (the target already aborts) but
# keeps the profile portable to other targets.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
