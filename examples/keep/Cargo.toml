[package]
name = "keep-example"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.pocopine]
bin = "server"
port = 3022

[package.metadata.pocopine.deploy]
mode = "fullstack"

[package.metadata.pocopine.deploy.processes.web]
bin = "server"
port = 3022

[package.metadata.pocopine.deploy.render]
# Replace with your Render workspace ID (Account Settings -> Workspaces).
owner_id = "REPLACE_WITH_RENDER_WORKSPACE_ID"
region = "oregon"
plan = "free"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = []

[dependencies]
pine = { package = "pine-ui", path = "../../crates/pine" }
pine-icons = { path = "../../crates/pine-icons" }
pine-richtext = { workspace = true, features = ["view"] }
pocopine = { path = "../../crates/pocopine" }
pocopine-auth-client = { workspace = true }
pocopine-sync = { workspace = true }
pocopine-sync-query = { workspace = true }
pocopine-sync-query-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
wasm-bindgen = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
pine-motion = { path = "../../crates/pine-motion" }
pocopine-sync-indexdb = { workspace = true }
pocopine-sync-sqlite = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { version = "0.3", features = ["Document", "Element", "Window"] }

[dev-dependencies]
pocopine-ts-rs = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pocopine-events = { workspace = true }
pocopine-live = { workspace = true }
pocopine-logging = { workspace = true }
pocopine-server = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
