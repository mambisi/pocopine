<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pocopine HN</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --orange:    #ff6600;
      --orange-dk: #d25000;
      --orange-bg: #fff4e8;
      --ink:       #1a1a1a;
      --ink-soft:  #3a3a3a;
      --muted:     #828282;
      --border:    #e8e5df;
      --card:      #ffffff;
      --cream:     #faf8f3;
    }
    html { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0; padding: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: "Verdana", "Geneva", system-ui, -apple-system, sans-serif;
      font-size: 14.5px; line-height: 1.55;
    }
    a { color: var(--ink); text-decoration: none; }
    a:hover { color: var(--orange-dk); }
    code, .mono, .points, .domain, nav a, .hn-header .brand,
    .comment__meta, .story__meta, .story-head__meta,
    .search__input, .search__submit {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    ::selection { background: var(--orange); color: #fff; }

    .shell { max-width: 820px; margin: 0 auto; padding: 0 1rem; }

    .hn-header {
      display: flex; align-items: center; gap: 1rem;
      background: var(--orange); color: #fff;
      padding: 0.55rem 1rem;
      margin: 0 -1rem 1.25rem;
    }
    .hn-header .brand {
      color: #fff; font-weight: 700; font-size: 1rem; letter-spacing: 0.02em;
    }
    .hn-header .brand__news {
      color: rgba(255, 255, 255, 0.78); font-weight: 500; margin-left: 0.2em;
    }
    .hn-header nav { display: flex; gap: 1rem; margin-left: auto; }
    .hn-header nav a { color: #fff; font-size: 0.85rem; }
    .hn-header nav a:hover { text-decoration: underline; }

    main { padding: 0 0 2rem; min-height: 50vh; }
    footer {
      padding: 1.25rem 0; border-top: 1px solid var(--border);
      color: var(--muted); font-size: 0.78rem;
      display: flex; justify-content: center;
    }

    /* search */
    .search {
      display: flex; gap: 0;
      margin-bottom: 0.5rem;
      border: 1px solid var(--border);
      background: #fff;
      transition: border-color 0.1s;
    }
    .search:focus-within { border-color: var(--orange); }
    .search__input {
      flex: 1;
      padding: 0.7rem 0.9rem;
      border: none; outline: none;
      background: transparent;
      font-size: 0.95rem;
      color: var(--ink);
    }
    .search__input::placeholder { color: var(--muted); }
    .search__submit {
      border: none;
      background: var(--orange);
      color: #fff;
      padding: 0 1.1rem;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: background-color 0.1s;
    }
    .search__submit:hover { background: var(--orange-dk); }

    .status-row {
      color: var(--muted); font-size: 0.82rem;
      padding: 0.15rem 0 0.8rem;
      font-family: ui-monospace, Menlo, monospace;
    }
    .status-row strong { color: var(--ink); }
    .status-row code {
      background: var(--orange-bg); color: var(--orange-dk);
      padding: 1px 5px; border-radius: 2px;
    }
    .status { color: var(--muted); font-size: 0.88rem; padding: 0.4rem 0; }
    .status--error { color: var(--orange-dk); }

    /* stories — nicer card rows */
    .stories { list-style: none; padding: 0; margin: 0; counter-reset: story; }
    .stories li.story {
      counter-increment: story;
      display: grid;
      grid-template-columns: 2rem 1fr;
      gap: 0.5rem;
      padding: 0.75rem 0.9rem;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      transition: background-color 0.08s;
    }
    .stories li.story:hover { background: var(--orange-bg); }
    .stories li.story::before {
      content: counter(story) ".";
      color: var(--muted);
      font-family: ui-monospace, Menlo, monospace;
      font-size: 0.85rem;
      text-align: right; padding-top: 3px;
    }
    .story__body { min-width: 0; }
    .story__title {
      font-size: 0.98rem; line-height: 1.35;
      color: var(--ink); font-weight: 500;
      margin-right: 0.25rem;
    }
    .story__title:visited { color: var(--ink-soft); }
    .story__title:hover { color: var(--orange-dk); text-decoration: underline; }
    .domain { color: var(--muted); font-size: 0.8rem; }
    .story__meta {
      margin-top: 0.3rem;
      color: var(--muted); font-size: 0.78rem;
      display: flex; gap: 0.45rem; flex-wrap: wrap; align-items: baseline;
    }
    .story__meta .points strong { color: var(--orange-dk); font-weight: 700; }
    .story__meta .sep { color: var(--border); }
    .story__meta .comments-link { color: var(--muted); }
    .story__meta .comments-link:hover { color: var(--orange-dk); text-decoration: underline; }

    /* story detail */
    .story-head { padding: 0.5rem 0 0.75rem; border-bottom: 1px solid var(--border); margin-bottom: 0.75rem; }
    .story-head__title {
      font-size: 1.35rem; margin: 0 0 0.4rem;
      font-family: "Verdana", system-ui, sans-serif;
      line-height: 1.25;
    }
    .story-head__meta {
      color: var(--muted); font-size: 0.82rem;
      display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: baseline;
    }
    .story-head__meta .points strong { color: var(--orange-dk); font-weight: 700; }
    .story-head__meta .sep { color: var(--border); }
    .story-head__link a { color: var(--orange-dk); }
    .story-head__link a:hover { text-decoration: underline; }
    .story-text { margin: 0.75rem 0 1.5rem; color: var(--ink-soft); }
    .story-text p { margin: 0 0 0.75rem; }

    /* comments */
    h2 {
      font-size: 0.82rem;
      font-family: ui-monospace, Menlo, monospace;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
      margin: 1.5rem 0 0.75rem;
    }
    .comments { list-style: none; padding: 0; margin: 0; }
    .comments--nested {
      padding-left: 0.9rem;
      border-left: 2px solid var(--border);
      margin-top: 0.5rem;
    }
    .comment {
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--border);
    }
    .comments--nested .comment:last-child { border-bottom: none; }
    .comment__meta {
      color: var(--muted); font-size: 0.75rem; margin-bottom: 0.3rem;
      display: flex; gap: 0.4rem; flex-wrap: wrap;
    }
    .comment__meta .sep { color: var(--border); }
    .comment__author { color: var(--ink); font-weight: 600; }
    .comment__body { color: var(--ink-soft); font-size: 0.92rem; }
    .comment__body p { margin: 0 0 0.5rem; }
    .comment__body p:last-child { margin-bottom: 0; }
    .comment__body a { color: var(--orange-dk); text-decoration: underline; }
    .comment__body pre {
      background: var(--cream); padding: 0.5rem 0.7rem;
      overflow-x: auto; font-size: 0.85em;
    }

    @media (max-width: 640px) {
      .hn-header nav { gap: 0.75rem; }
      .story-head__title { font-size: 1.15rem; }
      .stories li.story { padding: 0.6rem; }
    }
  </style>
</head>
<body>
  <app-shell></app-shell>
  <script type="module">
    import init from "./pkg/hn.js";
    init();
  </script>
</body>
</html>
