<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="pocopine — a Rust/WASM framework. Components, stores, and server functions in one codebase." />
  <title>pocopine — a Rust/WASM app framework</title>
  <style>
    /* ───── reset + base ────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      margin: 0;
      padding: 0;
      background: #f3e7cf;
      color: #1b100a;
      font-family: ui-serif, Iowan Old Style, "Charter", Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.6;
    }

    :root {
      --cream:     #f3e7cf;
      --beige:     #e8d7b5;
      --card:      #ebdbba;
      --border:    #d9c394;
      --ink:       #1b100a;
      --ink-soft:  #3a2820;
      --muted:     #6b5643;
      --red:       #a32727;
      --red-dark:  #731616;
      --red-faint: #d47272;
      --ok:        #416e37;
    }

    /* ───── typography ──────────────────────────────────── */
    h1, h2, h3 {
      font-family: ui-serif, Iowan Old Style, "Charter", Georgia, serif;
      color: var(--ink);
      line-height: 1.08;
      letter-spacing: -0.015em;
      margin: 0 0 1rem;
      font-weight: 600;
    }
    h1 { font-size: clamp(2.4rem, 6vw, 3.8rem); font-weight: 700; }
    h2 { font-size: 1.55rem; margin-top: 4rem; margin-bottom: 1.1rem; }
    h3 { font-size: 1.1rem; font-weight: 700; }
    p  { margin: 0 0 1rem; }

    a { color: var(--red); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover { color: var(--red-dark); }

    code, pre, .mono, .brand, nav a, .btn, .chip, .route-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-feature-settings: "ss01", "cv01";
    }
    code { font-size: 0.93em; }

    ::selection { background: var(--red); color: var(--cream); }

    /* ───── shell / layout ──────────────────────────────── */
    .shell { max-width: 960px; margin: 0 auto; padding: 0 1.5rem; }
    .site-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 2rem;
      padding: 1.5rem 0 1rem;
    }
    main { padding: 2rem 0 4rem; min-height: 50vh; }
    footer {
      padding: 2rem 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .route-mono { color: var(--muted); }
    footer code { background: var(--card); padding: 1px 5px; }

    .brand {
      font-size: 1.05rem; font-weight: 600;
      color: var(--ink); text-decoration: none;
      padding-bottom: 2px; border-bottom: 2px solid var(--red);
    }
    .brand::after {
      content: ""; display: inline-block; width: 6px; height: 6px;
      margin-left: 6px; background: var(--red); vertical-align: 2px;
    }
    nav { display: flex; gap: 1.5rem; }
    nav a {
      color: var(--ink-soft); text-decoration: none; font-size: 0.9rem;
      padding-bottom: 2px; border-bottom: 1px solid transparent;
    }
    nav a:hover { color: var(--red); border-bottom-color: var(--red); }

    /* ───── hero ───────────────────────────────────────── */
    .hero { padding: 3rem 0 2rem; border-bottom: 1px solid var(--border); }
    .hero__eyebrow {
      font-family: ui-monospace, Menlo, monospace;
      color: var(--red); font-size: 0.82rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      margin-bottom: 1.2rem;
    }
    .hero h1 { max-width: 16ch; }
    .hero h1 em { font-style: italic; color: var(--red); }
    .lede { max-width: 46ch; font-size: 1.2rem; line-height: 1.55; color: var(--ink-soft); }
    .actions { margin-top: 2rem; display: flex; gap: 0.75rem; flex-wrap: wrap; }

    .btn {
      display: inline-flex; align-items: center;
      padding: 0.7rem 1.1rem; font-size: 0.92rem;
      text-decoration: none; border: 2px solid var(--ink); line-height: 1;
      cursor: pointer; background: transparent; color: var(--ink);
      transition: background-color 0.12s, color 0.12s, border-color 0.12s;
    }
    .btn.primary { background: var(--red); color: var(--cream); border-color: var(--red); }
    .btn.primary:hover { background: var(--red-dark); border-color: var(--red-dark); color: var(--cream); }
    .btn.primary:disabled { background: var(--red-faint); border-color: var(--red-faint); cursor: not-allowed; }
    .btn.ghost:hover { background: var(--ink); color: var(--cream); }

    /* ───── section label ──────────────────────────────── */
    .section__label {
      display: inline-block; color: var(--red);
      font-family: ui-monospace, Menlo, monospace;
      font-size: 0.82rem; letter-spacing: 0.1em; text-transform: uppercase;
      margin-right: 0.5rem;
    }
    section p.sub, .sub { max-width: 55ch; color: var(--ink-soft); }

    /* ───── code blocks ────────────────────────────────── */
    pre {
      background: var(--card); border-left: 3px solid var(--red);
      padding: 1rem 1.15rem; margin: 0;
      overflow-x: auto; font-size: 0.88rem; line-height: 1.55;
      color: var(--ink-soft);
    }
    .two-col {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;
      align-items: start;
    }
    .two-col figure { margin: 0; }
    .two-col figcaption {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 0.78rem; color: var(--muted);
      margin-bottom: 0.45rem; letter-spacing: 0.05em; text-transform: uppercase;
    }

    /* ───── demo frame + counter ───────────────────────── */
    .demo-frame {
      background: var(--card); border: 1px solid var(--border);
      padding: 2rem; position: relative;
    }
    .demo-frame::before {
      content: "LIVE"; position: absolute; top: 0.7rem; right: 0.7rem;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 0.7rem; letter-spacing: 0.15em;
      color: var(--red); padding: 2px 6px; border: 1px solid var(--red);
    }
    .counter { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .counter__btn {
      background: var(--ink); color: var(--cream); border: none;
      font-family: ui-monospace, Menlo, monospace; font-size: 1.1rem;
      width: 2.6rem; height: 2.6rem; cursor: pointer;
    }
    .counter__btn:hover { background: var(--red); }
    .counter__value {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 2.5rem; font-weight: 700; color: var(--red);
      min-width: 3ch; text-align: center; line-height: 1;
    }
    .counter__reset {
      background: transparent; border: 1px solid var(--ink);
      color: var(--ink); padding: 0.4rem 0.8rem;
      font-family: ui-monospace, Menlo, monospace; font-size: 0.85rem;
      cursor: pointer; margin-left: auto;
    }
    .counter__reset:hover { background: var(--ink); color: var(--cream); }

    /* ───── cards (features on home) ──────────────────── */
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 1.25rem; }
    .card { padding-top: 1rem; border-top: 2px solid var(--ink); }
    .card .chip {
      display: inline-block; background: var(--red); color: var(--cream);
      font-size: 0.68rem; letter-spacing: 0.12em; padding: 2px 6px;
      margin-bottom: 0.7rem; text-transform: uppercase;
    }
    .card h3 { margin-bottom: 0.4rem; }
    .card p { color: var(--ink-soft); font-size: 0.98rem; line-height: 1.55; margin: 0; }

    /* ───── blog list ──────────────────────────────────── */
    .article-list { list-style: none; padding: 0; margin: 1.5rem 0 0; display: grid; gap: 1.25rem; }
    .article-card {
      padding: 1.25rem 1.5rem; background: var(--card);
      border-left: 3px solid var(--red);
    }
    .article-card h3 { margin-bottom: 0.25rem; font-size: 1.2rem; }
    .article-card h3 a { color: var(--ink); text-decoration: none; }
    .article-card h3 a:hover { color: var(--red); text-decoration: underline; }
    .article-date {
      font-family: ui-monospace, Menlo, monospace;
      color: var(--muted); font-size: 0.78rem;
      margin-bottom: 0.5rem; letter-spacing: 0.04em;
    }
    .article-card p:last-child { color: var(--ink-soft); margin: 0; }

    /* ───── blog post ──────────────────────────────────── */
    .post-head { margin: 1.5rem 0 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; }
    .post-head h1 { margin-bottom: 0.25rem; }
    .post-body p { font-size: 1.05rem; line-height: 1.65; }
    .post-body code {
      background: var(--card); padding: 1px 5px;
      border-radius: 0; font-size: 0.92em;
    }

    /* ───── contact form ───────────────────────────────── */
    .contact-form {
      display: grid; gap: 1rem; margin-top: 1.5rem;
      max-width: 520px;
    }
    .contact-form label { display: grid; gap: 0.35rem; }
    .contact-form label span {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 0.78rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted);
    }
    .contact-form input,
    .contact-form textarea {
      background: var(--card); border: 1px solid var(--border);
      padding: 0.65rem 0.8rem;
      font-family: inherit; font-size: 1rem; color: var(--ink);
      outline: none;
    }
    .contact-form input:focus,
    .contact-form textarea:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 2px rgba(163, 39, 39, 0.15);
    }
    .contact-form textarea { resize: vertical; font-family: inherit; }
    .contact-form button { justify-self: start; }

    /* ───── status messages ────────────────────────────── */
    .status {
      padding: 0.7rem 1rem;
      font-size: 0.95rem;
      border-left: 3px solid var(--muted);
      background: var(--card);
    }
    .status--ok    { border-left-color: var(--ok);  color: var(--ok); }
    .status--error { border-left-color: var(--red); color: var(--red-dark); }

    /* ───── responsive ────────────────────────────────── */
    @media (max-width: 760px) {
      .site-header { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
      nav { gap: 1.2rem; }
      h2 { margin-top: 3rem; }
      .two-col, .cards { grid-template-columns: 1fr; }
      .counter__reset { margin-left: 0; }
      footer { flex-direction: column; }
    }
  </style>
</head>
<body>

  <app-shell></app-shell>

  <script type="module">
    import init from "./pkg/site.js";
    init();
  </script>

</body>
</html>
