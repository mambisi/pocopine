<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pine Charts</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #18212f;
      background: #f7f9fb;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    [pp-app] {
      width: min(900px, 100%);
    }

    .chart-demo {
      display: grid;
      gap: 24px;
    }

    .chart-demo-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }

    .chart-demo-header h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.1;
    }

    .chart-demo-header p {
      margin: 8px 0 0;
      color: #526173;
    }

    .chart-demo-actions {
      display: flex;
      gap: 8px;
    }

    .chart-demo-actions button {
      border: 1px solid #c7d0da;
      border-radius: 6px;
      background: white;
      color: inherit;
      cursor: pointer;
      font: inherit;
      padding: 8px 12px;
    }

    .chart-demo-actions button[data-active="true"] {
      border-color: #1d6fd8;
      color: #0f58b8;
    }

    .chart-panel {
      display: block;
      background: white;
      border: 1px solid #dde4ec;
      border-radius: 8px;
      box-sizing: border-box;
      padding: 20px;
      position: relative;
    }

    .chart-panel--radial {
      margin-inline: auto;
    }

    .chart-panel--metro {
      overflow: hidden;
    }

    .pine-chart-responsive-frame {
      min-width: 0;
    }

    .pine-chart-responsive-frame > pine-line-chart,
    .pine-chart-responsive-frame > pine-cartesian-chart,
    .pine-chart-responsive-frame > pine-scatter-chart,
    .pine-chart-responsive-frame > pine-layer-chart,
    .pine-chart-responsive-frame > pine-area-chart,
    .pine-chart-responsive-frame > pine-bar-chart,
    .pine-chart-responsive-frame > pine-pie-chart,
    .chart-panel .pine-line-chart,
    .chart-panel .pine-cartesian-chart,
    .chart-panel .pine-scatter-chart,
    .chart-panel .pine-layer-chart,
    .chart-panel .pine-area-chart,
    .chart-panel .pine-bar-chart,
    .chart-panel .pine-pie-chart {
      display: block;
      height: 100%;
      position: relative;
      width: 100%;
    }

    .pine-line-chart {
      color: #1d6fd8;
    }

    .pine-cartesian-chart {
      color: #1d6fd8;
    }

    .pine-area-chart {
      color: #16a085;
    }

    .pine-scatter-chart {
      color: #5b6ee1;
    }

    .pine-layer-chart {
      color: #18212f;
    }

    .pine-bar-chart {
      color: #16a085;
    }

    .pine-chart-svg {
      display: block;
      height: auto;
      max-width: 100%;
      overflow: visible;
    }

    .pine-chart-grid-line {
      stroke: #d9e2ec;
      stroke-width: 1;
    }

    .pine-chart-axis,
    .pine-chart-tick-line {
      stroke: #7b8897;
      stroke-width: 1;
    }

    .pine-chart-tick-label {
      fill: #526173;
      font-size: 12px;
    }

    .pine-chart-axis-label {
      fill: #334155;
      font-size: 12px;
      font-weight: 600;
    }

    .pine-chart-line {
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .pine-chart-area {
      opacity: 0.18;
    }

    .pine-chart-line[data-series="Actual"],
    .pine-chart-area[data-series="Actual"],
    .pine-chart-marker[data-series="Actual"],
    .pine-chart-point[data-series="Segment A"],
    .pine-chart-hover-marker[data-series="Segment A"],
    .pine-chart-hover-marker[data-series="Actual"] {
      color: #1d6fd8;
    }

    .pine-chart-line[data-series="API"],
    .pine-chart-area[data-series="API"],
    .pine-chart-marker[data-series="API"],
    .pine-chart-point[data-series="API"],
    .pine-chart-hover-marker[data-series="API"] {
      color: #16a085;
    }

    .pine-chart-line[data-series="Target"],
    .pine-chart-area[data-series="Target"],
    .pine-chart-marker[data-series="Target"],
    .pine-chart-point[data-series="Segment B"],
    .pine-chart-hover-marker[data-series="Segment B"],
    .pine-chart-hover-marker[data-series="Target"],
    .pine-chart-line[data-series="Render"],
    .pine-chart-area[data-series="Render"],
    .pine-chart-marker[data-series="Render"],
    .pine-chart-point[data-series="Render"],
    .pine-chart-hover-marker[data-series="Render"] {
      color: #d96c2c;
    }

    .pine-chart-line[data-series="Organic"],
    .pine-chart-area[data-series="Organic"],
    .pine-chart-marker[data-series="Organic"],
    .pine-chart-hover-marker[data-series="Organic"] {
      color: #16a085;
    }

    .pine-chart-line[data-series="Referral"],
    .pine-chart-area[data-series="Referral"],
    .pine-chart-marker[data-series="Referral"],
    .pine-chart-hover-marker[data-series="Referral"] {
      color: #d96c2c;
    }

    .pine-chart-marker {
      fill: white;
      stroke: currentColor;
      stroke-width: 2;
    }

    .pine-chart-point {
      fill: currentColor;
      opacity: 0.82;
      stroke: white;
      stroke-width: 1.5;
    }

    .pine-chart-marker[data-focused],
    .pine-chart-point[data-focused],
    .pine-chart-bar[data-focused],
    .pine-chart-pie-slice[data-focused] {
      stroke-dasharray: 3 2;
    }

    .pine-chart-marker[data-selected],
    .pine-chart-point[data-selected],
    .pine-chart-bar[data-selected],
    .pine-chart-pie-slice[data-selected] {
      stroke: #18212f;
      stroke-width: 3;
    }

    .pine-layer-chart-guide {
      opacity: 0.55;
      stroke-dasharray: 4 8;
    }

    .pine-layer-chart-line {
      filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.75));
    }

    .pine-layer-chart-marker {
      vector-effect: non-scaling-stroke;
    }

    .pine-layer-chart-reference-dot {
      opacity: 0.94;
      vector-effect: non-scaling-stroke;
    }

    .pine-layer-chart-label {
      dominant-baseline: middle;
      font-size: 13px;
      letter-spacing: 0;
    }

    .pine-layer-chart-icon-plane {
      opacity: 0.86;
    }

    .pine-chart-crosshair {
      stroke: #526173;
      stroke-dasharray: 4 4;
      stroke-width: 1;
    }

    .pine-chart-hover-marker {
      fill: white;
      stroke: currentColor;
      stroke-width: 2;
    }

    .pine-chart-tooltip {
      background: #18212f;
      border-radius: 6px;
      color: white;
      display: inline-flex;
      font-size: 13px;
      gap: 8px;
      left: var(--pine-chart-tooltip-x);
      padding: 6px 8px;
      pointer-events: none;
      position: absolute;
      top: var(--pine-chart-tooltip-y);
      transform: translate(10px, calc(-100% - 10px));
    }

    .pine-chart-tooltip[data-tooltip-x="left"] {
      transform: translate(calc(-100% - 10px), calc(-100% - 10px));
    }

    .pine-chart-tooltip[data-tooltip-y="below"] {
      transform: translate(10px, 10px);
    }

    .pine-chart-tooltip[data-tooltip-x="left"][data-tooltip-y="below"] {
      transform: translate(calc(-100% - 10px), 10px);
    }

    .pine-chart-tooltip-series {
      font-weight: 600;
    }

    .pine-chart-bar {
      fill: currentColor;
      opacity: 0.86;
    }

    .pine-chart-bar[data-hovered] {
      opacity: 1;
      stroke: #18212f;
      stroke-width: 1;
    }

    .pine-chart-bar[data-series="Organic"],
    .pine-chart-bar[data-series="API"] {
      fill: #16a085;
    }

    .pine-chart-bar[data-series="Referral"],
    .pine-chart-bar[data-series="Render"] {
      fill: #d96c2c;
    }

    .pine-chart-pie-slice {
      fill: currentColor;
      stroke: white;
      stroke-width: 1.5;
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .pine-chart-pie-slice[data-hovered] {
      opacity: 0.92;
      transform: scale(1.035);
    }

    .pine-chart-pie-slice[data-label="Organic"],
    .pine-chart-pie-slice[data-label="API"] {
      color: #16a085;
    }

    .pine-chart-pie-slice[data-label="Referral"],
    .pine-chart-pie-slice[data-label="Render"] {
      color: #d96c2c;
    }

    .pine-chart-pie-slice[data-label="Paid"],
    .pine-chart-pie-slice[data-label="Network"] {
      color: #1d6fd8;
    }

    .pine-chart-pie-slice[data-label="Partner"],
    .pine-chart-pie-slice[data-label="Idle"] {
      color: #7c3aed;
    }

    .pine-chart-center-value {
      fill: #18212f;
      font-size: 30px;
      font-weight: 700;
    }

    .pine-chart-center-label {
      fill: #526173;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .pine-chart-legend {
      display: block;
      color: #18212f;
    }

    .pine-chart-legend-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .pine-chart-legend-item {
      align-items: center;
      display: inline-flex;
      gap: 8px;
      font-size: 14px;
    }

    .pine-chart-legend-marker {
      block-size: 10px;
      border-radius: 2px;
      display: inline-block;
      inline-size: 18px;
    }

    .pine-chart-legend-marker[data-series="Organic"],
    .pine-chart-legend-marker[data-series="API"] {
      background: #16a085;
    }

    .pine-chart-legend-marker[data-series="Actual"] {
      background: #1d6fd8;
    }

    .pine-chart-legend-marker[data-series="Segment A"] {
      background: #1d6fd8;
    }

    .pine-chart-legend-marker[data-series="Referral"],
    .pine-chart-legend-marker[data-series="Target"],
    .pine-chart-legend-marker[data-series="Segment B"],
    .pine-chart-legend-marker[data-series="Render"] {
      background: #d96c2c;
    }

    .pine-chart-legend-marker[data-series="Paid"],
    .pine-chart-legend-marker[data-series="Network"] {
      background: #1d6fd8;
    }

    .pine-chart-legend-marker[data-series="Partner"],
    .pine-chart-legend-marker[data-series="Idle"] {
      background: #7c3aed;
    }

    @media (max-width: 640px) {
      body {
        padding: 20px;
      }

      .chart-demo-header {
        align-items: start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div pp-app>
    <chart-demo></chart-demo>
  </div>

  <script type="module">
    import init from "/pkg/charts.js";
    init();
  </script>
</body>
</html>
