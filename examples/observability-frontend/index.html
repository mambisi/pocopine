<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pocopine observability frontend</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f7f7f4;
        color: #202124;
      }

      body {
        margin: 0;
      }

      [pp-app] {
        min-height: 100vh;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 18px 24px;
        border-bottom: 1px solid #d8d6ce;
        background: #ffffff;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }

      nav {
        display: flex;
        gap: 10px;
      }

      a,
      button {
        border: 1px solid #b9b7ad;
        border-radius: 6px;
        background: #ffffff;
        color: #202124;
        font: inherit;
        font-weight: 600;
        line-height: 1;
        text-decoration: none;
      }

      a {
        padding: 10px 12px;
      }

      button {
        cursor: pointer;
        padding: 11px 14px;
      }

      main {
        width: min(920px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      section {
        display: grid;
        gap: 14px;
      }

      h2 {
        margin: 0;
        font-size: 26px;
      }

      p {
        margin: 0;
        color: #4d4f52;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-top: 8px;
      }

      .metric-card {
        display: grid;
        gap: 10px;
        min-width: 0;
        padding: 14px;
        border: 1px solid #d8d6ce;
        border-radius: 6px;
        background: #ffffff;
      }

      .metric-card span {
        color: #65676b;
        font-size: 13px;
        font-weight: 600;
      }

      output {
        font-weight: 700;
        color: #202124;
      }

      .metric-card output {
        overflow-wrap: anywhere;
      }

      @media (max-width: 760px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .metric-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 460px) {
        .metric-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div pp-app>
      <obs-frontend-shell></obs-frontend-shell>
    </div>
    <script type="module">
      import init from "/pkg/observability_frontend.js";

      await init();
    </script>
  </body>
</html>
