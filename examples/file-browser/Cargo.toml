[package]
name = "file-browser-example"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.pocopine]
bin = "server"
port = 3024

# RFC 092 — Pine Stylekit is the active CSS compiler for this example
# (index.html links /pkg/stylekit.css). It reads the @theme tokens from
# app.css and ignores the Tailwind @import/@source directives.
[package.metadata.pocopine.stylekit]
input = "app.css"
output = "pkg/stylekit.css"
src = "src"

# Tailwind retained as a fallback during the experiment (RFC 092 D8):
# `pocopine build` still emits pkg/tailwind.css; switch index.html back
# to it to compare.
[package.metadata.pocopine.tailwind]
input = "app.css"
output = "pkg/tailwind.css"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = []

[dependencies]
pine = { path = "../../crates/pine" }
pine-icons = { path = "../../crates/pine-icons" }
pocopine = { path = "../../crates/pocopine" }
pocopine-storage = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
wasm-bindgen = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pocopine-logging = { workspace = true }
pocopine-server = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
