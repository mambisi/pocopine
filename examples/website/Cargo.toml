[package]
name = "website"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.pocopine]
bin = "server"
port = 3001

[package.metadata.pocopine.assets]
bucket = "pocopinedev-assets"
endpoint = "https://87f4ebd172bae793c02371ac18760868.r2.cloudflarestorage.com"
public-base = "https://assets.pocopine.dev"

[package.metadata.pocopine.deploy]
mode = "fullstack"
# Everything the server serves out of POCOPINE_DIST. The default is just
# ["index.html", "pkg"]; this site also ships the global stylesheet, the
# mascot/favicon, and the build-time-rendered docs fragments. Directory
# entries (pkg, static-docs) are copied recursively.
static_files = ["index.html", "pkg", "styles.css", "mascot.svg", "static-docs", "icons", "assets", "install.sh"]

[package.metadata.pocopine.deploy.processes.web]
bin = "server"
port = 3001

[package.metadata.pocopine.deploy.railway]
# Defaults: project name = app name ("website"), environment = "production",
# image_registry derived from the git remote (GitHub → ghcr.io/<owner>).
# Override here when you need a non-default workspace or region.
# workspace_id = "ws-..."
# region = "us-west1"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = []

# RFC-099 Phase 4 — host SSR renderer. Registers the app + renders a URL
# to the [pp-app] document for `App::hydrate`. Host-only (pocopine-ssr is
# never linked into wasm). Run: `cargo run -p website --bin website-ssr -- /`.
[[bin]]
name = "website-ssr"
path = "src/bin/ssr.rs"

[dependencies]
pine = { package = "pine-ui", path = "../../crates/pine" }
pine-charts = { path = "../../crates/pine-charts" }
pine-icons = { path = "../../crates/pine-icons" }
pine-motion = { path = "../../crates/pine-motion" }
pocopine = { path = "../../crates/pocopine" }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
web-sys = { version = "0.3", features = [
    "Performance",
    "Window",
    "Response",
    "Event",
    "EventTarget",
    "MouseEvent",
    "CustomEvent",
    "Element",
    "HtmlInputElement",
    "Navigator",
    "Clipboard",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pocopine-logging = { workspace = true }
pocopine-server = { path = "../../crates/pocopine-server" }
pocopine-ssr = { path = "../../crates/pocopine-ssr" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

# Host-only: render docs/ markdown to static HTML at build time.
# pulldown-cmark does not target wasm, so this runs on the build host
# and the output is embedded via include! (see build.rs).
[build-dependencies]
# Asset hashing for RFC-100 Mode A: rendered fragments bake the
# content-addressed bucket URL (`assets/<hash8>/<rel>`) at build time.
pocopine-crypto = { workspace = true }
pulldown-cmark = "0.13"
toml = "0.8"
serde = { workspace = true }
# Pure-Rust syntax highlighting at build time (no Oniguruma C dep).
# Pre-colours docs code blocks + showcase snippets to inline-styled
# HTML, so the wasm bundle ships zero highlighter.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# Parse the Pine component source to auto-generate the props tables on
# the component reference pages (extract `#[prop]`/`#[model]` fields).
syn = { version = "2", features = ["full", "parsing"] }
quote = "1"
