[package]
name = "observability-smoke"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.pocopine]
bin = "server"
port = 3010

[lib]
crate-type = ["rlib"]

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "analytics_exporter"
path = "src/bin/analytics_exporter.rs"

[dependencies]
pocopine = { path = "../../crates/pocopine", features = ["analytics", "logging-otlp"] }
serde = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pocopine-server = { path = "../../crates/pocopine-server" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic", "trace"] }
serde_json = "1"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["transport"] }
