# Navigation manifest for the pocopine documentation site.
#
# The docs app reads this file to build the top-level tabs, the
# sidebar, and a static page for each markdown file. Page <title> and
# <meta description> come from each file's YAML front-matter; this file
# defines ordering, sidebar labels, and grouping.
#
# Schema:
#   [[group]]
#   section = "Docs" | "Tutorials"   # which top-level tab the group sits under
#   title   = "..."                   # sidebar group heading
#   pages   = [ { title = "...", path = "<relative-to-docs/>" }, ... ]
#
# URL slugs are derived from `path`: drop the `docs/` root and the
# `.md` extension, and map a folder's `README.md` to the folder index.
# Anything not listed here (e.g. docs/internal/) is excluded from the
# published site.

title = "pocopine docs"
site_url = "/"
edit_base = "https://github.com/mambisi/pocopine/edit/main/docs/"

[[group]]
section = "Docs"
title = "Getting Started"
pages = [
  { title = "Introduction", path = "getting-started/introduction.md" },
  { title = "Installation", path = "getting-started/installation.md" },
  { title = "Quickstart",   path = "getting-started/quickstart.md" },
]

