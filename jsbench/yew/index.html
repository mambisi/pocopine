    .container {
      margin: 0 auto;
      padding: 30px 15px;
      max-width: 1170px;

    .jumbotron {
      padding: 30px;

      background-color: #eee;

    }

    }

      color: #337ab7;

      text-decoration: none;
    }
    .glyphicon-remove::before {

      font-weight: 700;
      font-size: 20px;
      line-height: 1;
    }
    .preloadicon {
      opacity: 0;
